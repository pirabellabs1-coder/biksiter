# Base de développement local.
#
# L'image porte PostGIS : le schéma s'en sert pour la position des emplacements
# et l'index GiST de recherche par proximité.
#
#   docker compose up -d
#   npm run bd:migrer
#   npm run bd:semer
#
# En production, l'hébergement doit se situer dans l'Union européenne.

services:
  base:
    image: postgis/postgis:16-3.4
    container_name: bike-sitters-base
    environment:
      POSTGRES_USER: bikesitters
      POSTGRES_PASSWORD: developpement
      POSTGRES_DB: bikesitters
      # Pas d'option de locale ici : l'image ne contient pas fr_FR.UTF-8 et
      # initdb refuserait de démarrer. Le tri français, s'il devient utile, se
      # pose par colonne avec une COLLATION plutôt qu'en recompilant l'image.
    ports:
      - '5432:5432'
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bikesitters -d bikesitters']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donnees:
