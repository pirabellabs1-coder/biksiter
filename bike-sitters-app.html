<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Sitters — prototype complet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Meme charte que le site : le vert de la maison porte les actions, le bleu
     du bouclier ne sert plus qu'a ce qui touche a la protection.
       vert  #017628 — actions, liens, focus, marque
       bleu  #1677E8 — le bouclier : securite et verifications d'identite
       ambre #C97A12 — un velo actuellement garde, rien d'autre
       corail #C0432C — refus, erreur, signalement
     Tous les couples texte/fond depassent 4,5 de contraste. */
  --ink:#10231A; --slate:#587065; --paper:#F5F6F1; --raised:#FFFFFF;
  --chalk:#DCE5DD; --chalk-strong:#BDCCC0;
  --sky:#9FBAAB;
  --trust:#017628; --trust-deep:#005B20; --trust-wash:#EAF7EE; --trust-mist:#F4FAF5;
  --verified:#1677E8; --verified-ink:#0E5CB8; --verified-wash:#E7F1FE;
  --lamp:#C97A12; --lamp-ink:#7A4E0C; --lamp-wash:#FBF1DE;
  --alert:#C0432C; --alert-ink:#8C2F1E; --alert-wash:#FCEEEB;
  --r-card:18px; --r-ctl:12px;
  --sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --display:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
/* Accessibilité : qui a désactivé les animations dans son système ne doit pas
   les subir ici — vertiges, migraines, troubles vestibulaires. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}
body{margin:0;background:#E6EBE4;font-family:var(--sans);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font-family:var(--sans)}

.chrome{width:100%;max-width:900px;margin-bottom:12px}
.chrome-title{font-family:var(--display);font-size:17px;margin-bottom:8px}
.roleswitch{display:flex;gap:6px;background:var(--raised);border:1px solid var(--chalk);
  border-radius:999px;padding:4px;flex-wrap:wrap}
.roleswitch button{flex:1;min-width:100px;border:0;background:transparent;font-size:12.5px;
  padding:8px 6px;border-radius:999px;cursor:pointer;color:var(--slate)}
.roleswitch button.on{background:var(--trust);color:#fff}
.chrome-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.hint{font-size:12px;color:var(--slate);line-height:1.5;flex:1}
.linkbtn{border:1px solid var(--chalk-strong);background:var(--raised);border-radius:var(--r-ctl);
  padding:7px 12px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}

.phone{width:390px;max-width:100%;height:800px;background:var(--paper);
  border:1px solid var(--chalk-strong);border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 1px 2px rgba(22,36,46,.06);transition:width .18s}
.phone.wide{width:900px;height:800px;border-radius:14px}
.screen{flex:1;overflow-y:auto}
.pad{padding:16px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--chalk);background:var(--raised)}
.topbar h2{font-size:16px;flex:1;min-width:0}
.iconbtn{border:0;background:transparent;cursor:pointer;color:var(--slate);font-size:18px;
  line-height:1;padding:4px}

.tabs{display:flex;border-top:1px solid var(--chalk);background:var(--raised)}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:9px 0 12px;
  font-size:10px;color:var(--slate);display:flex;flex-direction:column;align-items:center;
  gap:3px;position:relative}
.tabs button.on{color:var(--trust)}
.tabs .glyph{font-size:17px;line-height:1}
.dot{position:absolute;top:6px;right:50%;margin-right:-16px;width:7px;height:7px;
  border-radius:50%;background:var(--alert)}

.card{background:var(--raised);border:1px solid var(--chalk);border-radius:var(--r-card);
  overflow:hidden;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--chalk-strong)}
.card-body{padding:12px 13px}
.thumb{height:96px;background:var(--trust-mist)}
.thumb.sm{width:46px;height:46px;border-radius:9px;flex:none;background:var(--paper);border:1px solid var(--chalk)}

.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--trust-wash);color:var(--trust-deep);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.avatar.lg{width:54px;height:54px;font-size:19px}
.avatar.sm{width:30px;height:30px;font-size:12px}

.t-s{font-size:12px}.t-xs{font-size:11px}
.muted{color:var(--slate)}
.strong{font-weight:500}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill{display:inline-block;font-size:11px;padding:4px 9px;border-radius:999px}
.pill.ver{background:var(--verified-wash);color:var(--verified-ink)}
.pill.trust{background:var(--trust-wash);color:var(--trust-deep)}
.pill.lamp{background:var(--lamp-wash);color:var(--lamp-ink)}
.pill.alert{background:var(--alert-wash);color:var(--alert-ink)}
.pill.plain{background:var(--paper);color:var(--slate);border:1px solid var(--chalk)}

.banner{border-radius:var(--r-ctl);padding:11px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.55}
.banner.trust{background:var(--trust-wash);color:var(--trust-deep)}
.banner.ver{background:var(--verified-wash);color:var(--verified-ink)}
.banner.lamp{background:var(--lamp-wash);color:var(--lamp-ink)}
.banner.alert{background:var(--alert-wash);color:var(--alert-ink)}

.btn{display:block;width:100%;border:0;border-radius:var(--r-ctl);padding:13px;
  font-size:14px;cursor:pointer;text-align:center}
.btn.primary{background:var(--trust);color:#fff}
.btn.primary:hover{background:var(--trust-deep)}
.btn.ghost{background:var(--raised);border:1px solid var(--chalk-strong);color:var(--ink)}
.btn.danger{background:var(--raised);border:1px solid var(--chalk-strong);color:var(--alert)}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto}
.btn+.btn{margin-top:8px}
.btnrow{display:flex;gap:8px}
.btnrow .btn+.btn{margin-top:0}
.footer{padding:12px 16px 16px;border-top:1px solid var(--chalk);background:var(--raised)}

label{display:block;font-size:11px;color:var(--slate);margin:0 0 5px}
input,select,textarea{width:100%;font-family:var(--sans);font-size:14px;padding:10px 11px;
  border:1px solid var(--chalk-strong);border-radius:var(--r-ctl);background:var(--raised);color:var(--ink)}
textarea{min-height:74px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--trust);outline-offset:1px;border-color:var(--trust)}
.field{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* La comparaison des constats reste sur deux colonnes, meme sur telephone :
   les mettre l'un sous l'autre reviendrait a ne pas comparer. */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;
  margin-bottom:14px}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--chalk)}
.sw{width:40px;height:23px;border-radius:999px;background:var(--chalk-strong);position:relative;
  cursor:pointer;flex:none}
.sw.on{background:var(--trust)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:left .15s}
.sw.on::after{left:19px}

.chip{border:1px solid var(--chalk);background:var(--raised);border-radius:999px;
  padding:7px 12px;font-size:12px;cursor:pointer;color:var(--slate)}
.chip.on{background:var(--trust-wash);border-color:var(--trust);color:var(--trust-deep)}
.chip.dead{opacity:.42;cursor:default}
.chip-n{opacity:.6;font-size:11px}
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.rw{border:1px solid var(--chalk);border-radius:16px;overflow:hidden;background:var(--raised)}
.rw-off{opacity:.62}
.rw-img{height:64px;background:var(--trust-wash);display:grid;place-items:center}
.rw-off .rw-img{background:var(--paper)}
.rw-img svg{width:58px;height:36px}
.rw-txt{padding:10px 11px 12px}
.rw-nm{font-size:13px;font-weight:600;margin:0 0 2px;line-height:1.3}
.rw-px{font-size:12px;font-weight:600;color:var(--trust-deep);margin:7px 0 0}
.rw-off .rw-px{color:var(--slate)}
.linklines{margin-top:10px;border-top:1px solid rgba(11,87,224,.16);padding-top:6px}
.linkline{display:flex;justify-content:space-between;gap:10px;font-size:12px;
  color:var(--trust-deep);padding:3px 0}
.linkline b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.searchcard{background:var(--raised);border:1px solid var(--chalk);border-radius:26px;
  padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(22,36,46,.06)}
.sfield{background:var(--raised);border:1px solid var(--chalk-strong);border-radius:15px;
  padding:15px 16px;margin-bottom:11px;display:flex;align-items:center;gap:11px;
  cursor:pointer;min-height:54px}
.sfield:focus-within{border-color:var(--trust)}
.sfield input{border:0;padding:0;background:transparent;font-size:15px;width:100%;color:var(--ink)}
.sfield input[type=time]{width:auto;flex:none;font-size:15px;font-weight:500}
.sfield select.heure{border:0;background-color:transparent;font-size:15px;font-weight:500;
  padding:0 15px 0 0;width:auto;flex:none;min-width:62px;background-position:right 0 center}
.sfield input[type=time]::-webkit-calendar-picker-indicator{display:none}
.sfield .sicon{font-size:15px;opacity:.5;flex:none}
.sfield .sdate{font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;flex:none}
.srow{display:flex;gap:11px}
.srow .sfield{flex:1;min-width:0;margin-bottom:11px}
.sfilters{align-items:center}
.sfilters-t{font-size:15px;font-weight:600;color:var(--ink)}
.sfilters-s{font-size:12.5px;color:var(--slate);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--trust-wash);
  color:var(--trust-deep);display:grid;place-items:center;font-size:21px;line-height:1}
.btn.pill{width:100%;border-radius:999px;padding:17px;font-size:16px;font-weight:600;margin:0}

.fakefield{border:1px solid var(--chalk-strong);border-radius:var(--r-ctrl);padding:11px 13px;
  font-size:15px;background:var(--raised);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between}
.fakefield .cal{font-size:13px;opacity:.55}

.map{height:150px;background:var(--trust-mist);position:relative;border-bottom:1px solid var(--chalk)}
.map.tall{height:290px}
.blob{position:absolute;border-radius:50%;background:var(--trust);opacity:.13}
.pin{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--trust)}
.pin.theft{background:var(--alert)}
.maplabel{position:absolute;right:8px;bottom:8px;background:var(--raised);border:1px solid var(--chalk);
  border-radius:var(--r-ctl);padding:4px 8px;font-size:10px;color:var(--slate)}

.tl-item{display:flex;gap:11px}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:11px;flex:none}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--trust);margin-top:4px}
.tl-dot.todo{background:transparent;border:1.5px solid var(--chalk-strong)}
.tl-dot.now{background:var(--lamp)}
.tl-line{width:1px;flex:1;background:var(--chalk);min-height:15px}
.tl-body{padding-bottom:13px}

.msg{max-width:76%;padding:9px 11px;border-radius:13px;font-size:13px;line-height:1.45;margin-bottom:7px}
.msg.them{background:var(--raised);border:1px solid var(--chalk);border-bottom-left-radius:4px}
.msg.me{background:var(--trust);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msgtime{font-size:10px;opacity:.7;display:block;margin-top:3px}

.listrow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--chalk);
  cursor:pointer;background:var(--raised)}
.listrow:hover{background:var(--paper)}
.section-h{font-size:11px;color:var(--slate);padding:16px 16px 7px}
.empty{text-align:center;padding:44px 24px;color:var(--slate);font-size:13px;line-height:1.6}
.empty .big{font-size:30px;display:block;margin-bottom:10px;opacity:.35}

.steps{display:flex;gap:4px;padding:0 16px 12px}
.step{flex:1;height:3px;border-radius:2px;background:var(--chalk)}
.step.on{background:var(--trust)}

.stars{display:flex;gap:5px}
.star{font-size:22px;cursor:pointer;color:var(--chalk-strong);line-height:1}
.star.on{color:var(--lamp)}

.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:#fff;
  border-radius:var(--r-ctl);padding:11px 13px;font-size:12.5px;opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:20}
.toast.show{opacity:1}

/* --- site public --- */
.nav{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--chalk);
  background:var(--raised);flex-wrap:wrap}
.nav .brand{font-family:var(--display);font-size:16px;flex:1}
.nav a{font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none}
.nav a:hover{color:var(--ink)}
.hero{padding:26px 16px 22px}
.hero h1{font-size:29px;line-height:1.1;letter-spacing:-.02em;margin-bottom:9px}
.hero p{font-size:13.5px;line-height:1.65;color:var(--slate);margin-bottom:16px;max-width:52ch}
.stat{font-family:var(--display);font-size:27px}
.foot{padding:18px 16px 26px;border-top:1px solid var(--chalk);background:var(--raised)}
.foot a{display:block;font-size:12px;color:var(--slate);padding:5px 0;cursor:pointer}

/* --- back-office --- */
.admin{display:flex;height:100%}
.side{width:190px;border-right:1px solid var(--chalk);background:var(--raised);padding:12px 0;overflow-y:auto;flex:none}
.side .brand{font-family:var(--display);font-size:14px;padding:6px 16px 12px}
.side button{display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 16px;font-size:12.5px;color:var(--slate);cursor:pointer}
.side button.on{background:var(--trust-wash);color:var(--trust-deep)}
.side button:hover{background:var(--paper)}
.main{flex:1;overflow-y:auto;padding:20px}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--raised);
  border:1px solid var(--chalk);border-radius:var(--r-card);overflow:hidden}
th{text-align:left;font-weight:500;font-size:11px;color:var(--slate);padding:10px 12px;
  border-bottom:1px solid var(--chalk);background:var(--paper)}
td{padding:10px 12px;border-bottom:1px solid var(--chalk);vertical-align:middle}
tr:last-child td{border-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--raised);border:1px solid var(--chalk);border-radius:var(--r-card);padding:13px}
.kpi .n{font-family:var(--display);font-size:23px}

/* --- index des pages --- */
.idx{padding:16px}
.idx h3{font-size:12px;color:var(--slate);margin:18px 0 8px;font-family:var(--sans)}
.idx h3:first-child{margin-top:0}
.idxgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.idxgrid button{text-align:left;border:1px solid var(--chalk);background:var(--raised);
  border-radius:var(--r-ctl);padding:9px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.idxgrid button:hover{border-color:var(--trust);color:var(--trust)}
/* Accent bleu clair de la palette : il souligne sans porter de texte. */
.searchcard{background:var(--trust-wash);border:1px solid rgba(125,175,201,.35)}
.phone{border-color:rgba(125,175,201,.45)}
.roleswitch button.on{background:var(--trust)}
.tabs button.on{color:var(--trust-deep)}
.card.tap:hover{border-color:var(--sky)}
.thumb{background:linear-gradient(135deg,var(--trust-wash),var(--paper))}
.map,.thumb.map{background:linear-gradient(160deg,var(--trust-mist),var(--trust-wash))}
.steps .step.on{background:var(--sky)}
hr,.sep{border-color:var(--chalk)}

/* =====================================================================
   FINITIONS VISUELLES
   Rayons plus larges, ombres douces, barre supérieure translucide,
   états de survol. Aucune couleur n'est imposée ici : la palette du
   système de design reste la seule source — bleu pour les actions,
   vert pour la vérification, ambre pour le vélo gardé.
   ===================================================================== */
/* =====================================================================
   DIRECTION VISUELLE — finitions 2026
   Rayons plus larges, ombres douces, barre supérieure translucide.
   La palette n'est pas touchée : le bleu porte les actions, le vert
   reste réservé à la vérification, l'ambre au vélo gardé.
   ===================================================================== */
/* =====================================================================
   DIRECTION VISUELLE 2026 — Bike Sitters
   Une interface urbaine, rassurante et plus premium.
   ===================================================================== */
html{background:#EEF1F1}
body{min-height:100vh;padding:28px 18px 56px;background:
    radial-gradient(circle at 18% 2%,rgba(28,91,133,.10),transparent 29rem),
    radial-gradient(circle at 86% 90%,rgba(233,162,59,.10),transparent 24rem),
    #EEF1F1}
.chrome{max-width:1080px;margin-bottom:18px}
.chrome-title{font-size:20px;font-weight:600;letter-spacing:-.025em;margin:0 0 12px}
.roleswitch{gap:5px;padding:5px;border-color:rgba(22,36,46,.08);box-shadow:0 8px 30px rgba(22,36,46,.06)}
.roleswitch button{padding:10px 13px;font-size:13px;font-weight:500;transition:.18s ease}
.roleswitch button.on{background:var(--ink);box-shadow:0 5px 14px rgba(22,36,46,.18)}
.chrome-row{gap:7px;margin-top:10px}
.linkbtn{padding:8px 11px;border-radius:10px;border-color:rgba(22,36,46,.10);transition:.18s ease}
.linkbtn:hover{transform:translateY(-1px);border-color:var(--trust);color:var(--trust-deep)}
.phone{width:410px;height:820px;border:7px solid #fff;border-radius:34px;box-shadow:0 30px 80px rgba(22,36,46,.16),0 2px 8px rgba(22,36,46,.08)}
.phone.wide{width:1080px;height:820px;border-radius:24px}
.screen{scrollbar-width:thin;scrollbar-color:var(--chalk-strong) transparent}
.pad{padding:19px}
.topbar{padding:17px 19px 14px;border-color:var(--chalk);position:sticky;top:0;z-index:8;background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}
.topbar h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;transition:.15s ease}
/* Une action ecrite ne tient pas dans un carre de 34 px : elle prend sa largeur. */
.iconbtn.texte{width:auto;height:34px;padding:0 10px;color:var(--trust);font-weight:600}
.iconbtn:hover{background:var(--trust-wash);color:var(--trust)}
.tabs{padding:6px 8px 7px;gap:3px;box-shadow:0 -8px 28px rgba(22,36,46,.05);position:relative;z-index:10}
.tabs button{padding:7px 2px 8px;border-radius:12px;font-weight:500;transition:.18s ease}
.tabs button.on{background:var(--trust-wash);color:var(--trust-deep)}
.tabs .glyph{font-size:19px}
.dot{top:4px;border:2px solid #fff;width:9px;height:9px}
.card{border-color:rgba(22,36,46,.075);box-shadow:0 8px 24px rgba(22,36,46,.045);margin-bottom:12px;transition:.2s ease}
.card.tap:hover{border-color:rgba(28,91,133,.35);transform:translateY(-2px);box-shadow:0 13px 28px rgba(22,36,46,.09)}
.card-body{padding:15px 16px}
.thumb{height:112px;background:linear-gradient(135deg,var(--trust-mist),var(--paper))}
.avatar{color:var(--trust-deep);font-weight:600;box-shadow:inset 0 0 0 1px rgba(28,91,133,.10)}
.pill{padding:5px 10px;font-weight:500;letter-spacing:.005em}
.banner{padding:13px 14px;border-radius:14px;border:1px solid transparent}
.banner.trust,.banner.ver{border-color:rgba(16,35,26,.08)}
.btn{border-radius:13px;padding:14px;font-weight:600;transition:.18s ease}
.btn.primary{box-shadow:0 8px 18px rgba(28,91,133,.20)}

/**
 * Code de remise a quatre chiffres.
 * Le velo change de mains deux fois : au depot et au retour. A chaque fois,
 * celui qui donne lit un code, celui qui recoit le saisit. Aucun materiel,
 * aucune permission, aucun reseau : le code se dicte a voix haute.
 * Il ne prouve pas la proximite — il prouve que les deux personnes se sont
 * parlees au bon moment, et c'est ce qu'on cherche.
 */
const CODE_TTL_H = 6;             // duree de validite, en heures
/**
 * Trois essais par code, puis regeneration.
 * C'est ce plafond, et non la longueur du code, qui protege reellement :
 * quatre chiffres sans limite se forcent en dix mille tentatives, alors
 * qu'avec trois essais la probabilite tombe a trois sur dix mille. Allonger
 * le code ou y mettre des lettres protegerait moins et generait davantage
 * deux personnes debout dehors, un velo a la main.
 */
const CODE_TRIES = 3;
/**
 * Un seul code par remise, detenu par celui qui DONNE le velo et saisi par
 * celui qui le RECOIT. B ne peut connaitre le code de A que si A le lui a dit :
 * la co-presence est donc etablie par une seule saisie. Un second code
 * n'etablirait pas un fait nouveau, il doublerait les gestes au moment le plus
 * fragile du parcours — dehors, un velo a la main.
 * Ce qui tranche un litige n'est de toute facon pas le code, mais le constat
 * d'etat : le code dit « nous etions la », le constat dit « dans quel etat ».
 */
const CODE_HOLDER = {depot:'cyclist', retour:'host'};

function handoverCode(r, phase){
  r.codes = r.codes || {};
  r.codeGen = r.codeGen || {};
  if(!r.codes[phase]){
    // Deterministe dans le prototype, pour rester testable — mais le numero de
    // tirage entre dans la graine, sinon un code regenere serait identique.
    const gen = (r.codeGen[phase] = (r.codeGen[phase] || 0) + 1);
    const seed = (r.id + phase + gen).split('').reduce((a,c)=>a + c.charCodeAt(0), 0);
    r.codes[phase] = {
      value: String(1000 + (seed * 7919 + gen * 137) % 9000),
      issuedAt: state.hoursPassed, tries: 0
    };
  }
  return r.codes[phase];
}
/** La remise est faite des que celui qui recoit a saisi le code. */
const handoverComplete = (r, phase) => !!(r.handover||{})[phase];
const codeExpired = c => (state.hoursPassed - c.issuedAt) > CODE_TTL_H;
const triesLeft = c => CODE_TRIES - (c.tries || 0);
function handoverIssues(r, phase, typed){
  const c = handoverCode(r, phase);
  if(codeExpired(c)) return ["Ce code a expiré. Demandez-en un nouveau."];
  if(!/^\d{4}$/.test(typed || '')) return ["Saisissez les quatre chiffres."];
  if(typed !== c.value)
    return ["Code incorrect. Il reste " + Math.max(0, triesLeft(c) - 1)
      + " essai" + (triesLeft(c) - 1 > 1 ? 's' : '') + "."];
  return [];
}
/**
 * Une saisie fausse consomme un essai. Au troisieme, le code est remplace :
 * son detenteur doit le relire, ce qui remet une personne dans la boucle.
 */
function countTry(r, phase, typed){
  const c = handoverCode(r, phase);
  if(typed === c.value) return true;
  c.tries = (c.tries || 0) + 1;
  if(c.tries >= CODE_TRIES){
    delete r.codes[phase];
    const holder = CODE_HOLDER[phase] === 'cyclist' ? r.cyclist : r.host;
    notify(holder, "Trois saisies erronées : un nouveau code a été généré. "
      + "Relisez-le à voix haute.", {screen:'detail', param:r.id});
    toast("Trois essais manqués. Un nouveau code vient d'être généré.");
  }
  return false;
}
function renewCode(id, phase){
  const r = reqById(id);
  // Seul le detenteur regenere son code : sinon un tiers peut le rendre inutilisable.
  if(!isParty(r) || CODE_HOLDER[phase] !== actorOf(r)){
    toast("Ce code n'est pas le vôtre.");
    return;
  }
  r.codes = r.codes || {};
  delete r.codes[phase];
  handoverCode(r, phase);
  toast("Nouveau code généré");
  render();
}

function actorOf(r){ return state.role===r.cyclist?'cyclist':(state.role===r.host?'host':'none'); }
const statusLabel = st => t('st.'+st);

/**
 * Toute action qui modifie l'etat passe par ici.
 * Hors ligne, elle est mise en file et rejouee a la reconnexion.
 * C'est le cas reel : on confirme un depot dans un garage en sous-sol.
 */
function act(label, fn){
  if(!state.online){
    state.queue.push({label, fn});
    toast("Hors ligne — action mise en file");
    render();
    return false;
  }
  if(state.failNext){
    state.failNext = false;
    state.lastError = {label, fn};
    toast("La connexion a échoué");
    render();
    return false;
  }
  state.lastError = null;
  fn();
  return true;
}
function retryLast(){

function transition(r, event, reason, asActor){
  const who = asActor || actorOf(r);
  const t = (TRANSITIONS[r.status]||[]).filter(x=>x.actor===who).find(x=>x.event===event);
  if(!t){ toast("Transition refusée : "+event+" depuis "+r.status); return; }
  if(USERS[state.role].status === 'suspended'){ toast("Compte suspendu : action impossible."); return; }
  if(!isActive(state.role)){ toast("Votre compte n'est pas encore validé."); return; }
  // Le velo ne change de mains qu'avec le code lu par celui qui le donne.
  const phase = event === 'receive' ? 'depot' : (event === 'return' ? 'retour' : null);
  if(phase && !handoverComplete(r, phase)){
    openHandover(r.id, phase);
    return;
  }
  // « Personne n'est venu » n'a de sens qu'une fois l'heure passee d'une bonne
  // marge : declare trop tot, il annulerait une garde qui allait avoir lieu.
  // On ne renonce pas au bout de deux minutes : le bike sitter descend peut-etre.
  if(event === 'noanswer' && waitingAtDoor(r) < ATTENTE_SORTIE_MIN){
    toast("Attendez " + ATTENTE_SORTIE_MIN + " minutes après votre arrivée, et appelez "
      + "d'abord votre Bike Sitter.");
    return;
  }
  if(event === 'noshow' && r.status === 'ACCEPTED' && lateAtDrop(r) < RETARD_DEPOT_MIN){
    toast("Attendez au moins " + RETARD_DEPOT_MIN + " minutes après l'heure convenue.");
    return;
  }
  const sp = spaceOf(r);
  // La capacite est verifiee A L'ACCEPTATION, pas a la demande.
  if(event === 'accept' && capacityLeft(sp, r) <= 0){
    toast("Capacité atteinte sur ce créneau : " + sp.capacity + " vélos.");
    return;
  }
  // Un emplacement suspendu n'accueille plus : accepter une demande revenait a
  // promettre une place qui n'apparait dans aucune recherche.
  if(event === 'accept' && sp.status !== 'published'){
    toast("Cet emplacement est suspendu. Republiez-le avant d'accepter.");
    return;
  }
  const run = () => {
  if(reason){ r.reason = reason; }
  const opener = actorOf(r);
  apply(r, t.to, opener);
  if(event === 'dispute'){
    state.reports.unshift({id:'p'+(state.seq++), by:state.role, targetType:'session', target:r.id,
      reason:"Litige sur une garde", details:reason || "Motif non précisé",
      status:'open', date:"aujourd'hui"});
    notify(r.cyclist===state.role ? r.host : r.cyclist,
      "Un litige a été ouvert sur votre garde.", null, true);
  }
  if(event === 'accept'){
    if(r.repeat && r.repeat !== 'none' && !r.seriesOf) spawnSeries(r);
    // L'acceptation de la derniere place fait expirer les demandes concurrentes.
    state.requests.filter(x => x.spaceId === r.spaceId && x.status === 'PENDING'
        && x.id !== r.id && overlap(x, r) && capacityLeft(sp, x) <= 0)
      .forEach(x => {
        apply(x, 'EXPIRED', 'système');
        notify(x.cyclist, "Le créneau demandé n'est plus disponible chez " + publicName(r.host) + ".");
      });
  }
  };
  if(!act(t.label, run)) return;
  if(r.status==='BIKE_RECEIVED') apply(r,'ACTIVE','système');
  if(r.status==='BIKE_RETURNED') apply(r,'COMPLETED','système');
  render();
}
/**
 * Constat d'etat, au depot et a la restitution.
 * Deux photos et un etat declare, valides des deux cotes. C'est ce constat
 * qui permet de trancher « ma roue etait droite en arrivant » — sans lui,
 * un litige oppose deux paroles.
 */
const BIKE_STATES = {
  ok:      "Bon état, rien à signaler",
  usure:   "Traces d'usage habituelles",
  defaut:  "Défaut visible",
  batterie:"Batterie inquiétante — gonflée, chaude ou odorante"
};

/*
 * La batterie qui inquiete.
 *
 * Une batterie gonflee, anormalement chaude ou qui degage une odeur peut
 * prendre feu, et le velo sera range dans un local ferme, souvent sous une
 * habitation. Le bike sitter peut refuser le velo a ce seul titre, sans que ce
 * soit un litige : ce n'est pas un reproche, c'est une precaution.
 */
const BATTERIE_RISQUE = 'batterie';
function checkOf(r, phase){ return (r.checks || {})[phase] || null; }
/** Un constat n'est complet qu'avec deux photos et un etat declare. */
function checkIssues(draft){
  const out = [];
  // Le brouillon compte les photos par un nombre ; un enregistrement en porte
  // la liste. La verification accepte les deux plutot que d'en supposer une.
  const nbPhotos = Array.isArray(draft.photos) ? draft.photos.length : (draft.photos || 0);
  if(nbPhotos < 2) out.push("Ajoutez deux photos du vélo.");
  if(!draft.state) out.push("Indiquez l'état constaté.");
  if(draft.state === 'defaut' && !(draft.note || '').trim())
    out.push("Décrivez le défaut constaté.");
  return out;
}
function saveCheck(id, phase){
  const r = reqById(id);
  // Un constat engage les deux parties : personne d'autre ne l'ecrit.
  if(!isParty(r)){ toast("Cette garde ne vous concerne pas."); return; }
  // Et il ne se modifie jamais : s'il pouvait etre reecrit apres coup, la
  // comparaison entre le depot et le retour ne vaudrait plus rien. Une erreur
  // se corrige en ouvrant un litige, pas en effacant la trace.
  if((r.checks || {})[phase]){
    toast("Ce constat est déjà enregistré et ne peut plus être modifié.");
    return;
  }
  const draft = state.checkDraft || {};
  const issues = checkIssues(draft);
  if(issues.length){ toast(issues[0]); return; }
  r.checks = r.checks || {};
  r.checks[phase] = {
    state: draft.state, note: (draft.note||'').trim(), photos: draft.photos || 0,
    by: state.role, at: clock(), date: fmtDate(phase === 'depot' ? r.date : endDate(r))
  };
  state.checkDraft = {state:'', note:'', photos:0};
  // Une batterie inquietante au depot arrete la : le velo ne rentre pas dans un
  // local ferme, souvent sous une habitation.
  if(phase === 'depot' && r.checks.depot.state === BATTERIE_RISQUE){
    r.status = 'CANCELLED';
    r.reason = "Batterie jugée dangereuse au moment du dépôt.";
    r.events.push({from:'ARRIVAL', to:'CANCELLED', actor:'host', at:clock(),
      note:"Vélo refusé : batterie inquiétante"});
    notify(r.cyclist, "Votre vélo n'a pas été accueilli : la batterie a été jugée "
      + "inquiétante — gonflée, chaude ou odorante. Faites-la vérifier avant de "
      + "redemander une garde.", {screen:'detail', param:r.id}, true);
    toast("Vélo refusé. Le constat et les photos sont conservés.");
    render();
    return;
  }
  // Le constat de retour se compare a celui du depot : c'est la son utilite.
  const before = checkOf(r, 'depot');
  if(phase === 'retour' && before && before.state !== r.checks.retour.state){
    notify(r.cyclist, MSG.checkDiffers,
      {screen:'detail', param:r.id});
    notify(r.host, MSG.checkDiffers,
      {screen:'detail', param:r.id});
  }
  toast("Constat enregistré");
  back();
}

/**
 * Les maillons : ce que le reseau doit au bike sitter pour une garde rendue.
 *
 * Trois principes tiennent tout le mecanisme.
 * 1. Un maillon nait a la CLOTURE, jamais avant : tant que le velo n'est pas
 *    revenu a son proprietaire, la garde n'est pas terminee.
 * 2. Chaque garde ecrit sa propre ligne. Le solde est la somme des lignes,
 *    jamais un nombre isole — c'est ce qui permet d'annuler apres un litige,
 *    de changer le bareme, ou d'ajouter un plafond sans rien migrer.
 * 3. Le montant suit la contrainte acceptee, pas le service rendu : un cargo
 *    occupe la place de deux velos et beaucoup de bike sitters le refusent.
 *
 * Le bareme ci-dessous est un point de depart. Les vraies valeurs viendront du
 * test : on ne sait pas encore quelle part des gardes concerne des cargos, ni
 * combien depassent la journee.
 */
// BULKY est deja declare plus bas : la meme liste sert a l'assistant d'ajout.
/*
 * Ce que vaut une garde.
 *
 * Trois paliers plutot qu'un calcul a l'heure : un bareme continu se discute,
 * trois paliers se retiennent. Et l'ecart se justifie tout seul — garder treize
 * heures n'est pas treize fois plus contraignant qu'une heure, c'est d'un autre
 * ordre.
 */
function hoursOf(r){
  const a = minutesOf(r.from || '00:00'), b = minutesOf(r.to || '00:00');
  return Math.max(0, (b - a) / 60);
}
function linkValue(r){
  const bike = (state.bikes.find(b => b.id === r.bike) || {}).type;
  const encombrant = BULKY.includes(bike) ? 2 : 1;
  const jours = Math.max(1, spanDays(r));
  let base;
  if(jours > 1){
    base = 3 * jours;                       // cas ouvert par la moderation
  } else {
    // Les paliers suivent les chiffres du vol : la moitie des velos sont voles
    // en moins de trente minutes, plus des trois quarts en moins de trois heures.
    const h = hoursOf(r);
    base = h <= 1 ? 1 : (h <= 3 ? 2 : 3);
  }
  return base * encombrant;
}
/*
 * Ce qui empeche d'accumuler des maillons sans rendre de service.
 *
 * Aucune de ces regles ne rend la fraude impossible — elles la rendent peu
 * rentable, ce qui est le seul objectif atteignable. Deux amis qui simulent des
 * gardes plafonnent a neuf maillons par mois : trois mois de complicite assidue
 * pour un controle velo, personne ne le fera.
 *
 * Et les gardes ne sont jamais bloquees : seuls les maillons cessent d'etre
 * crees. Deux voisins qui s'entraident vraiment ne sont genes en rien.
 */
const BINOME_MAX  = 3;    // gardes par mois entre les deux memes personnes
const MENSUEL_MAX = 40;   // maillons gagnes par personne et par mois
const MAILLON_MIN_H = 0.5;  // en dessous, aucun maillon n'est cree

/*
 * Une garde dure au moins une heure.
 *
 * En dessous, se retrouver, ouvrir, faire les deux constats et repartir
 * represente l'essentiel du rendez-vous : ce n'est plus une garde, c'est un
 * derangement. Les quarts d'heure servent a ajuster, pas a raccourcir.
 */
const GARDE_MIN_H = 1;

/*
 * On ne demande pas une garde plus d'une semaine a l'avance.
 *
 * Une garde est ponctuelle : une course, un rendez-vous, une journee de
 * travail. Personne ne sait quinze jours a l'avance qu'il ira au cinema un
 * mardi — et une place bloquee si longtemps prive les autres sans servir.
 *
 * Le bike sitter, lui, declare ses fermetures sur tout le mois : c'est son
 * agenda, pas une reservation.
 */
const HORIZON_J = 7;

/** Combien de gardes ces deux-la ont-ils deja menees ce mois-ci. */
const gardesBinome = (a, b) => state.requests.filter(r =>
  r.links && ((r.cyclist === a && r.host === b) || (r.cyclist === b && r.host === a))
).length;

/** Combien de maillons cette personne a-t-elle gagnes ce mois-ci. */
const gagnesCeMois = who =>
  linkLines(who).reduce((n, r) => n + r.links.value, 0);

/** Signale a la moderation ce qu'aucune regle automatique ne doit trancher. */
function signalerAbus(r, motif){
  if(state.reports.some(p => p.target === r.id && p.reason === motif)) return;
  state.reports.unshift({id:'p'+(state.seq++), by:'système', targetType:'session',
    target:r.id, reason:motif,
    details:"Plafond atteint entre " + publicName(r.cyclist) + " et "
      + publicName(r.host) + ". À regarder, pas à sanctionner.",
    status:'open', date:"aujourd'hui"});
}

/** La ligne ecrite a la cloture. Gelee tant qu'un litige n'est pas tranche. */
function grantLinks(r){
  if(r.links) return;                      // une garde ne paie qu'une fois
  // Une garde trop courte n'en est pas une : depot et reprise a quelques
  // minutes d'intervalle ne creent rien.
  if(hoursOf(r) < MAILLON_MIN_H) return;
  if(gardesBinome(r.cyclist, r.host) >= BINOME_MAX){
    signalerAbus(r, "Plafond mensuel entre deux membres atteint");
    notify(r.host, "Cette garde ne crée pas de maillon : vous avez atteint la "
      + "limite mensuelle avec ce membre. La garde, elle, compte normalement.");
    return;
  }
  if(gagnesCeMois(r.host) >= MENSUEL_MAX){
    notify(r.host, "Vous avez atteint le plafond mensuel de maillons. "
      + "Vos gardes continuent d'être comptées.");
    return;
  }
  const bike = (state.bikes.find(b => b.id === r.bike) || {}).type;
  r.links = {value: linkValue(r), bike: bike, days: Math.max(1, spanDays(r)),
             at: clock(), frozen: false};
}
const linkLines = who => state.requests.filter(r => r.host === who && r.links);
/** Le solde ne compte pas les lignes gelees : un litige suspend, il ne retire pas. */
const linksEarned = who =>
  linkLines(who).filter(r => !r.links.frozen).reduce((n, r) => n + r.links.value, 0);
/** Ce que le catalogue a consomme : un bon expire ne compte plus, ses maillons reviennent. */
const linksSpent = who => state.vouchers
  .filter(v => v.member === who && v.status !== 'expired')
  .reduce((n, v) => n + v.cost, 0);
/** Le solde disponible : ce qui a ete gagne, moins ce qui a ete echange. */
const linkBalance = who => linksEarned(who) - linksSpent(who);
/** Combien de velos ce membre a-t-il confies : l'autre facon de faire vivre le reseau. */
const dropCount = who =>
  state.requests.filter(r => r.cyclist === who && r.status === 'COMPLETED').length;

function apply(r, to, actor){
  r.events.push({from:r.status, to, actor, at:clock()});
  if(to === 'ARRIVAL') r.arrivedH = state.hoursPassed;
  r.status = to;
  // Des qu'une garde est confirmee, les autres demandes pour le meme velo au
  // meme moment n'ont plus d'objet : on les annule et on le dit.
  if(to === 'ACCEPTED'){
    const autres = concurrentes(r);
    autres.forEach(x => {
      x.status = 'CANCELLED';
      x.reason = "Une autre garde a été confirmée pour ce vélo sur le même créneau.";
      x.events.push({from:'PENDING', to:'CANCELLED', actor:'system', at:clock(),
        note:"Annulée automatiquement : garde confirmée ailleurs"});
      notify(x.host, publicName(x.cyclist) + " a confirmé une garde ailleurs sur ce créneau. "
        + "Sa demande chez vous est annulée, et la place est de nouveau libre.",
        {screen:'detail', param:x.id}, true);
      state.journal.unshift({id:'j'+(state.seq++), admin:'—',
        action:"Demande annulée automatiquement", target:x.id,
        reason:"Garde confirmée ailleurs pour le même vélo", at:"aujourd'hui"});
    });
    if(autres.length)
      notify(r.cyclist, autres.length + (autres.length > 1 ? " autres demandes" : " autre demande")
        + " pour ce vélo " + (autres.length > 1 ? "ont" : "a")
        + " été annulée" + (autres.length > 1 ? "s" : "")
        + " : un vélo ne peut être gardé qu'à un endroit.",
        {screen:'activity'}, true);
  }
  if(to==='ACCEPTED' && !convoOf('parking', r.id)){
    const c = openConvo('parking', r.cyclist, r.host, r.id);
    state.messages[c.id] = [{from:r.host, text:MSG.firstReply, at:clock()}];
  }
  const link = {screen:'detail', param:r.id};
  // Le constat se fait au moment ou le velo change de mains, jamais plus tard.
  if(to==='BIKE_RECEIVED' && !checkOf(r,'depot'))
    notify(r.host, "Établissez le constat d'état du vélo reçu.", link);
  if(to==='BIKE_RETURNED' && !checkOf(r,'retour'))
    notify(r.cyclist, "Vérifiez l'état de votre vélo et confirmez le constat.", link);
  if(to==='RETURN_REQUESTED')
    notify(r.host, "Le cycliste vient récupérer son vélo. Votre code de restitution est prêt.",
      link);
  if(to==='ACCEPTED') notify(r.cyclist, "Votre demande a été acceptée. L'adresse exacte est maintenant visible.", link);
  if(to==='DECLINED') notify(r.cyclist, "Votre demande a été refusée.", link);
  if(to==='COMPLETED'){
    // Le velo est revenu et les deux codes ont ete saisis : la garde est due.
    grantLinks(r);
    notify(r.host, linkLines(r.host).length === 1
      ? "Vous avez accueilli le vélo de "+publicName(r.cyclist)+" — "+r.links.value
        + " maillon"+(r.links.value>1?'s':'')+". Ils comptent vos gardes, et le réseau vous "
        + "en remerciera."
      : "Garde terminée : +"+r.links.value+" maillon"+(r.links.value>1?'s':'')+".",
      {screen:'profile'});
    notify(r.cyclist,MSG.askReview, {screen:'review', param:r.id});
    notify(r.host,MSG.askReview, {screen:'review', param:r.id});
    const m = milestone(r.host);
    if(MILESTONES.includes(m.count))
      notify(r.host, "Jalon franchi : "+m.count+" vélos accueillis. Merci.", {screen:'profile'});
    const host = USERS[r.host];
    if(host && host.invitesLeft !== undefined){
      host.invitesLeft += 1;
      notify(r.host, "Une invitation supplémentaire vous a été créditée.", {screen:'invitations'});
    }
  }
}
/** Une conversation existe par elle-meme : garde, observation de vol, support. */
function openConvo(type, a, b, ref){
  const found = convoOf(type, ref);
  if(found) return found;
  const c = {id:'cv'+(state.seq++), type, a, b, ref};
  state.convos.unshift(c);
  state.messages[c.id] = state.messages[c.id] || [];
  return c;
}
const convoOf = (type, ref) => state.convos.find(c => c.type===type && c.ref===ref);
const myConvos = () => state.convos.filter(c => c.a===state.role || c.b===state.role);
const convoById = id => state.convos.find(c => c.id===id);
function convoOther(c){ return u(c.a===state.role ? c.b : c.a); }
function convoTitle(c){
  if(c.type === 'parking'){
    const r = reqById(c.ref);
    return r ? statusLabel(r.status)+' · '+spanLabel(r) : "Stationnement";
  }
  const t = theftById(c.ref);
  return t ? "Vélo aperçu · "+t.brand+' '+t.model : "Observation";
}

/**
 * Heures de tranquillite. Personne ne veut etre reveille a 2 h du matin pour
 * une demande de garde. La notification n'est pas perdue : elle est
 * differee jusqu'a la reouverture, et le sait.
 */
const DEFAULT_QUIET = {from:'22:00', to:'07:00'};
function quietOf(id){
  const p = USERS[id];
  if(!p || p.quiet === null) return null;
  return p.quiet || DEFAULT_QUIET;
}
/** Vrai si `time` tombe dans la plage de silence, y compris a cheval sur minuit. */
function inQuiet(id, time){
  const q = quietOf(id);
  if(!q) return false;
  const t = minutesOf(time), a = minutesOf(q.from), b = minutesOf(q.to);
  return a > b ? (t >= a || t < b) : (t >= a && t < b);
}
function notify(to, text, link, urgent){
  // Une notification vers un destinataire inconnu n'atteint personne et
  // encombre la file : mieux vaut ne pas l'ecrire.
  if(!to || !USERS[to]) return;
  const now = clock();
  // La plage de silence protege du bruit, pas de l'urgence : un desistement a
  // quelques heures de l'arrivee ou un litige ouvert ne peuvent pas attendre
  // sept heures du matin.
  const held = !urgent && inQuiet(to, now);
  state.notifications.unshift({id:'n'+(state.seq++), to, text, link:link||null,
    at: held ? "différée jusqu'à " + (quietOf(to)||DEFAULT_QUIET).to : now,
    deferred: held, read:false});
}
function clock(){ const b=14*60+3+(state.minute+=7);
  return String(Math.floor(b/60)%24).padStart(2,'0')+':'+String(b%60).padStart(2,'0'); }

function back(){ state.profileDraft=null; state.spaceDraft=null; const b=state.back.pop(); if(b){state.screen=b.s;state.param=b.p;} else { state.screen=TABSCREEN[state.tab]||'explore'; } scrollTop(); render(); }

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/**
 * Le moderateur n'est pas un membre du reseau : il n'a ni velo, ni emplacement.
 * Sans cette valeur de repli, tout ecran rendu sous ce role plante sur un champ
 * absent — et c'est arrive.
 */
const ANON = {id:'?', name:'—', last:'', initial:'—', verified:[], sessions:0,
  since:'—', rating:0, account:'active', status:'active', quiet:null};
const u = id => USERS[id] || ANON;
/**
 * Nom affiche publiquement : prenom + initiale du nom.
 * Assez pour distinguer deux Lucas d'un meme quartier, pas assez pour
 * retrouver quelqu'un. Le nom complet reste connu de la plateforme et
 * n'est jamais rendu public (docs §7.3).
 */
function publicName(id){
  const p = USERS[id];
  // Un identifiant inconnu — le moderateur, un compte supprime — se nomme, il ne
  // laisse pas un blanc au milieu d'une phrase.
  if(!p) return 'Membre';
  return p.last ? p.name + ' ' + p.last[0].toUpperCase() + '.' : p.name;
}
const spaceById = id => state.spaces.find(s=>s.id===id);
const reqById = id => state.requests.find(r=>r.id===id);
/**
 * Une garde passee peut referencer un emplacement supprime.
 * On rend alors un objet minimal plutot que de laisser planter l'historique.
 */
const GONE_SPACE = {id:null, type:"Emplacement supprimé", spot:"Emplacement supprimé",
  capacity:0, bikes:[], security:[], photoList:[], open:{days:[], from:'00:00', to:'00:00'},
  approx:'—', address:'—', desc:'', status:'paused', kind:'personne'};
const spaceOf = r => spaceById(r.spaceId) || GONE_SPACE;
/**
 * La reference d'une garde. Elle sert au support, aux litiges et, plus tard, a
 * un assureur : une garde doit pouvoir etre nommee sans passer par un
 * identifiant technique.
 */
const gardeRef = r => 'BS-' + String(r.id).replace(/[^0-9]/g,'').padStart(4,'0');

/*
 * Ce qu'un membre traine derriere lui — et rien de plus.
 *
 * Pas de motif, pas de date, pas d'histoire : un bike sitter a le droit de
 * savoir qu'une garde precedente ne s'est pas terminee normalement, il n'a pas
 * a connaitre les raisons de quelqu'un d'autre.
 *
 * Et rien n'est automatique : c'est la moderation qui inscrit la trace apres
 * avoir regarde. Quelqu'un d'hospitalise ne doit rien trainer.
 */
/*
 * Depuis quand ce bike sitter n'a-t-il plus accueilli.
 *
 * C'est la maladie documentee des reseaux d'entraide : des annonces qui restent
 * visibles alors que la personne a decroche depuis des mois. Warmshowers a
 * essaye de la traiter par un peage a l'entree ; cela decourage surtout ceux
 * qui donnent sans rien demander.
 *
 * Dire quand la derniere garde a eu lieu ne juge personne et laisse le cycliste
 * decider. Approximatif a dessein : une date precise sur un compte endormi
 * ressemble a un reproche.
 */
/**
 * Combien de bike sitters se sont ajoutes cette semaine.
 * Un total dit la taille ; ce chiffre-la dit que le reseau bouge maintenant.
 */
function newSittersThisWeek(){
  return state.spaces.filter(sp =>
    sp.status === 'published' && (sp.createdH || 0) >= state.hoursPassed - 168).length;
}

function lastHostedHours(who){
  const closes = state.requests.filter(r => r.host === who && r.status === 'COMPLETED');
  if(!closes.length) return null;
  // Le prototype date les gardes en heures ecoulees depuis le debut.
  return Math.min.apply(null, closes.map(r => r.ageH || 0));
}

function activityLabel(who){
  const h = lastHostedHours(who);
  if(h === null){
    const emp = state.spaces.some(sp => sp.owner === who && sp.status === 'published');
    return emp ? "Nouveau — aucune garde pour l'instant" : '';
  }
  /*
   * L'echelle suit le temps vecu : minutes sous une heure, heures sous un jour,
   * jours sous une semaine, semaines sous un mois, puis mois et annees.
   *
   * Toujours approximatif — une date precise sur un compte endormi ressemble a
   * un reproche.
   */
  const t = h + state.hoursPassed;
  const dire = q => "Dernière garde il y a " + q;
  const pluriel = (n, mot) => n + ' ' + mot + (n > 1 ? 's' : '');

  if(t < 1){
    const min = Math.max(1, Math.round(t * 60));
    return dire(pluriel(min, 'minute'));
  }
  if(t < 24) return dire(pluriel(Math.floor(t), 'heure'));

  const j = Math.floor(t / 24);
  if(j < 7)  return dire(pluriel(j, 'jour'));

  const sem = Math.floor(j / 7);
  if(sem < 4) return dire(pluriel(sem, 'semaine'));

  const mois = Math.floor(j / 30);
  if(mois < 12) return dire(pluriel(Math.max(1, mois), 'mois').replace('moiss', 'mois'));

  return dire(pluriel(Math.floor(j / 365), 'an'));
}

const tracesOf = who => (USERS[who] || {}).traces || [];
const traceCount = who => tracesOf(who).length;

/** La phrase affichee, au singulier ou au pluriel. */
function traceLabel(who){
  const n = traceCount(who);
  if(!n) return '';
  return n === 1
    ? "Une garde ne s'est pas terminée normalement"
    : n + " gardes ne se sont pas terminées normalement";
}

/** La moderation inscrit ou retire une trace, jamais le produit tout seul. */
function addTrace(who, kind, ref){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const u = USERS[who];
  if(!u) return;
  u.traces = (u.traces || []).concat([{kind, ref, at:"aujourd'hui"}]);
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Trace inscrite",
    target:who, reason:kind, at:"aujourd'hui"});
  notify(who, "Une garde qui ne s'est pas terminée normalement a été notée sur votre profil. "
    + "Écrivez-nous si vous pensez que c'est une erreur.", {screen:'profile'});
  toast("Trace inscrite"); render();
}

function clearTraces(who){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const u = USERS[who];
  if(!u || !traceCount(who)) return;
  u.traces = [];
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Traces effacées",
    target:who, reason:'—', at:"aujourd'hui"});
  notify(who, "Les traces inscrites sur votre profil ont été retirées.", {screen:'profile'});
  toast("Traces effacées"); render();
}

/*
 * Le velo qui n'est pas repris.
 *
 * Le cas arrivera : demenagement, hospitalisation, mauvaise foi. Le bike sitter
 * se retrouve avec un velo chez lui sans savoir quoi en faire, et sans droit de
 * s'en defaire.
 *
 * On ne code ici que ce qui ne demande aucune decision juridique : rendre le
 * retard VISIBLE, pour le bike sitter et pour la moderation. La bascule
 * automatique et le depot au commissariat attendent des delais valides — les
 * ecrire au hasard exposerait l'association plus que de ne rien ecrire.
 */
const OVERDUE_H = 24;   // au-dela, la garde est signalee comme en retard

/** Depuis combien d'heures la reprise aurait-elle du avoir lieu. */
function overdueHours(r){
  if(!ENGAGE.includes(r.status)) return 0;
  // Un litige ne fait pas disparaitre le retard : c'est souvent la meme
  // situation vue autrement — le velo n'est toujours pas revenu.
  const fin = minutesOf(r.to || '00:00') / 60
    + (spanDays(r) - 1) * 24;
  const ecoule = minutesOf('08:00') / 60 + state.hoursPassed;
  return Math.max(0, Math.round(ecoule - fin));
}
const isOverdue = r => overdueHours(r) >= OVERDUE_H;
/** Les gardes en retard, pour le back-office. Les plus anciennes d'abord. */
const overdueList = () => state.requests.filter(isOverdue)
  .sort((a, b) => overdueHours(b) - overdueHours(a));

/*
 * Passer la main a la moderation.
 *
 * Le bike sitter garde le velo — il l'a accepte, cela l'engage — mais il cesse
 * d'avoir a courir apres quelqu'un qui ne repond plus. Trois jours suffisent :
 * en dessous, un retard est banal ; au-dela, la personne seule face au probleme
 * finit par s'en defaire n'importe comment.
 */
const RELAIS_J = 3;   // jours de retard avant de pouvoir passer la main

function signalerNonRecupere(id){
  const r = reqById(id);
  if(!r){ toast("Stationnement introuvable."); return; }
  if(r.host !== state.role){
    toast("Seul le bike sitter qui garde le vélo peut le signaler.");
    return;
  }
  if(overdueHours(r) < RELAIS_J * 24){
    toast("Contactez d'abord le propriétaire. Passé " + RELAIS_J
      + " jours, nous prenons le relais.");
    return;
  }
  if(r.handedOver){ toast("C'est déjà signalé — la modération s'en occupe."); return; }
  r.handedOver = { at: clock(), by: state.role };
  // Le systeme ouvre parfois deja un dossier pour la meme garde : on complete
  // le sien plutot que d'en creer un second, sinon le moderateur traite deux
  // fois la meme situation.
  const deja = state.reports.find(p =>
    p.target === r.id && p.reason === "Vélo non récupéré");
  const details = "Reprise dépassée de " + Math.floor(overdueHours(r) / 24) + " jours. "
    + "Le bike sitter garde le vélo et passe la main.";
  if(deja){
    deja.details = details;
    deja.status = 'open';
  } else {
    state.reports.unshift({id:'p'+(state.seq++), by:state.role, targetType:'session',
      target:r.id, reason:"Vélo non récupéré", details, status:'open', date:"aujourd'hui"});
  }
  notify(r.cyclist, "Votre vélo n'a pas été repris. L'association vous contacte : "
    + "répondez, même si vous ne pouvez pas venir tout de suite.", null, true);
  notify(r.host, "C'est noté. Gardez le vélo chez vous sans le sortir — nous reprenons "
    + "le dossier et revenons vers vous.", null, true);
  toast("La modération prend le relais");
  render();
}

/** Une phrase lisible : « reprise prévue il y a 3 jours ». */
function overdueLabel(r){
  const h = overdueHours(r);
  if(h < OVERDUE_H) return '';
  const j = Math.floor(h / 24);
  return j >= 1
    ? "Reprise prévue il y a " + j + " jour" + (j > 1 ? 's' : '')
    : "Reprise prévue il y a " + h + " heures";
}
/** Les velos du membre connecte : un velo appartient a quelqu'un. */
const myBikes = () => state.bikes.filter(b => b.owner === state.role);
/** Un membre ne declare pas plus de velos qu'il n'en possede raisonnablement. */
const MAX_BIKES = 8;

/*
 * Registres de velo. Le champ est international a dessein : MyBike en Belgique,
 * Bicycode en France, RegistratieBewijs aux Pays-Bas, Bike Index ailleurs.
 *
 * REGLE ABSOLUE : tant que Bike Sitters ne peut pas interroger le registre,
 * l'enregistrement reste DECLARE. On n'ecrit jamais « vélo vérifié » pour une
 * affirmation que personne n'a controlee — ce serait la pire des fausses
 * securites, puisqu'elle porterait sur l'origine du velo.
 */
/*
 * Qui porte le projet. Ce n'est pas un detail : on demande a des gens d'ouvrir
 * leur cave a un inconnu, et savoir qui est derriere compte plus que n'importe
 * quelle fonctionnalite.
 */
const FOUNDER = {
  name: "[Votre prénom]",
  initial: "?",
  role: "Fondateur — Ixelles"
};

const REGISTRIES = [
  {code:'mybike',   pays:'BE', nom:'MyBike'},
  {code:'bicycode', pays:'FR', nom:'Bicycode'},
  {code:'rdw',      pays:'NL', nom:'RDW / RegistratieBewijs'},
  {code:'bikeindex',pays:'—',  nom:'Bike Index'},
  {code:'autre',    pays:'—',  nom:'Autre registre'}
];
const registryName = code => (REGISTRIES.find(r => r.code === code) || {}).nom || '—';
/** Ce qu'on affiche d'un enregistrement : jamais « vérifié » sans contrôle réel. */
function registryLabel(b){
  if(!b || !b.registry) return '';
  return b.registryStatus === 'verified'
    ? "Enregistré chez " + registryName(b.registry) + " — vérifié par Bike Sitters"
    : "Enregistrement déclaré chez " + registryName(b.registry) + " — non vérifié";
}
const theftById = id => state.thefts.find(t=>t.id===id);
const myRequests = () => state.requests.filter(r=>r.cyclist===state.role||r.host===state.role);
const mySpaces = () => state.spaces.filter(s=>s.owner===state.role);
const myNotifs = () => state.notifications.filter(n=>n.to===state.role);
const unreadCount = () => myRequests().filter(r=>r.status==='PENDING'&&r.host===state.role).length;
const convoCount = () => myConvos().filter(c=>(state.messages[c.id]||[]).some(m=>m.from!==state.role)).length;
/*
 * Le numero de telephone.
 *
 * Obligatoire a l'inscription — quelqu'un devant une porte fermee n'a aucun
 * recours sans lui, et c'est le moment ou tout se joue. Mais il est donne pour
 * verifier qu'on est joignable, pas pour etre publie : il ne s'ouvre donc qu'a
 * l'acceptation, seulement a l'autre partie, et se referme a la cloture.
 *
 * Un litige le laisse ouvert : c'est precisement le moment ou il faut se parler.
 */
function canSeePhone(r){
  if(!r || !isParty(r)) return false;
  if(r.status === 'DISPUTED') return true;
  return ENGAGE.includes(r.status);
}
/** Le numero de l'autre partie, s'il est ouvert. */
function otherPhone(r){
  if(!canSeePhone(r)) return '';
  const autre = r.cyclist === state.role ? r.host : r.cyclist;
  return (USERS[autre] || {}).phone || '';
}

const canSeeAddress = r => ['ACCEPTED','ARRIVAL','BIKE_RECEIVED','ACTIVE','RETURN_REQUESTED','BIKE_RETURNED','COMPLETED'].includes(r.status);

/* ---- Regles de creneau, de capacite et de temps ------------------- */
const DAY_NAMES = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
/** Deux semaines a partir du vendredi 5 septembre, pour que la recurrence ait de quoi se derouler. */
const DATES = (() => {
  const out = []; let day = 5, wd = 5;
  for(let i=0; i<14; i++){
    out.push({
      label: DAY_NAMES[wd] + ' ' + day + ' septembre',
      short: String(day).padStart(2,'0') + '/09/2026',
      day, wd
    });
    day++; wd = (wd+1) % 7;
  }
  return out;
})();
const dateIndex = label => DATES.findIndex(d => d.label === label);
/** Forme numerique JJ/MM/AAAA, celle qu'on affiche dans les champs. */
function fmtDate(label){
  const d = DATES.find(x => x.label === label);
  return d ? d.short : label;
}
const labelOfDay = day => {
  const d = DATES.find(x => x.day === day);
  return d ? d.label : null;
};
const weekdayOf = label => (DATES.find(d=>d.label===label)||DATES[0]).wd;
const HELD = ['ACCEPTED','ARRIVAL','BIKE_RECEIVED','ACTIVE','RETURN_REQUESTED','BIKE_RETURNED'];

/**
 * Disponibilite d'un emplacement pour une garde, sur une ou plusieurs journees.
 * Le depot doit tomber dans les horaires du premier jour, la recuperation dans
 * ceux du dernier. Entre les deux, le velo dort sur place : les horaires de
 * fermeture ne s'appliquent pas, seuls comptent les jours d'accueil.
 */
function withinHours(sp, date, from, to, dateTo){
  if(!sp.open) return true;
  const last = dateTo || date;
  const h1 = hoursForDay(sp, date);
  const h2 = hoursForDay(sp, last);
  if(!h1 || !h2) return false;                 // jour ferme ou fermeture exceptionnelle
  if(from < h1.from || from > h1.to) return false;
  if(to > h2.to || to < h2.from) return false;
  // Un lieu sans local ferme ne garde rien en dehors de sa presence :
  // depot et recuperation doivent tomber le meme jour.
  if(isRelay(sp) && !sp.closedStorage && date !== last) return false;
  return true;
}
/** '14:30' -> 870 minutes. Le reste du code compare les heures en chaines. */
const minutesOf = t => {
  const [h, m] = String(t || '0:0').split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};

/**
 * Une garde peut couvrir plusieurs journees : une nuit, un week-end,
 * une semaine. `date` est le depot, `dateTo` la recuperation (le meme jour
 * par defaut). Tout le calcul se fait en minutes absolues depuis le jour 0.
 */
const endDate = r => r.dateTo || r.date;
function absStart(r){ return dateIndex(r.date) * 1440 + minutesOf(r.from); }
function absEnd(r){ return dateIndex(endDate(r)) * 1440 + minutesOf(r.to); }
/** Nombre de journees entamees, au minimum 1. */
function spanDays(r){
  const d = dateIndex(endDate(r)) - dateIndex(r.date);
  return Math.max(1, d + 1);
}
function spanLabel(r){
  const days = spanDays(r);
  if(days === 1) return fmtDate(r.date) + ' · ' + r.from + ' → ' + r.to;
  if(days === 2) return fmtDate(r.date) + ' ' + r.from + ' → ' + fmtDate(endDate(r)) + ' ' + r.to
    + ' (une nuit)';
  return fmtDate(r.date) + ' ' + r.from + ' → ' + fmtDate(endDate(r)) + ' ' + r.to
    + ' (' + days + ' jours)';
}

/**
 * Marge entre deux gardes sur la meme place.
 * Sans elle, quelqu'un qui recupere a 17:00 croise devant la porte celui qui
 * depose a 17:00 — et le bike sitter ouvre deux fois en dix minutes.
 */
const BUFFER_MIN = 30;
function overlap(a, b){
  if(dateIndex(a.date) < 0 || dateIndex(b.date) < 0) return false;
  return (absStart(a) - BUFFER_MIN) < absEnd(b) && absStart(b) < (absEnd(a) + BUFFER_MIN);
}
/**
 * Emplacements du bon secteur qui correspondent, mais qui n'ont plus de place
 * sur le creneau demande. Les cacher ferait croire au cycliste que le quartier
 * est vide, alors que le reseau y existe : il doit juste changer d'heure.
 */
function fullSpaces(){
  const q = state.search;
  const zone = resolveZone((q.q || '').toLowerCase());
  return state.spaces.filter(sp =>
    sp.status === 'published'
    && !state.blocked.includes(sp.owner)
    && USERS[sp.owner].status !== 'suspended'
    && sp.owner !== state.role
    && (!zone || zone.includes(sp.city))
    && withinHours(sp, q.date, q.from, q.to, q.dateTo)
    && (onRequest(sp) || spanDays({date:q.date, dateTo:q.dateTo}) <= (sp.maxDays || 1))
    && capacityLeft(sp, {id:null, spaceId:sp.id, date:q.date, from:q.from, to:q.to}) <= 0);
}
/**
 * Prochaine heure de la journee ou la duree demandee tiendrait.
 * On balaie par pas de 30 minutes : c'est la granularite de la marge.
 */
function nextFreeAt(sp){
  const q = state.search;
  const span = minutesOf(q.to) - minutesOf(q.from);
  for(let start = minutesOf(q.from) + 30; start + span <= 22 * 60; start += 30){
    const from = pad(start), to = pad(start + span);
    if(!withinHours(sp, q.date, from, to)) continue;
    if(capacityLeft(sp, {id:null, spaceId:sp.id, date:q.date, from, to}) > 0) return from;
  }
  return null;
}
const pad = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');

/*
 * Un membre n'habite qu'a un endroit.
 *
 * Un seul emplacement prive, donc. Le second n'est possible que s'il s'agit
 * d'un lieu professionnel — commerce, association, atelier — avec son numero
 * d'entreprise : on peut legitimement avoir son domicile et sa boutique, pas
 * deux domiciles.
 *
 * Le produit verifie le format du numero ; la moderation verifie qu'il
 * correspond bien au lieu declare. Meme partage que pour l'identite : la
 * machine controle ce qui se controle sans contexte, l'humain juge le reste.
 */
const MAX_SPACES = 2;

/** Un numero d'entreprise belge : dix chiffres, cle de controle sur 97. */
function validEnterpriseNumber(num){
  const d = String(num || '').replace(/[^0-9]/g, '');
  if(d.length !== 10) return false;
  if(!/^[01]/.test(d)) return false;            // les numeros commencent par 0 ou 1
  const base = Number(d.slice(0, 8));
  const cle  = Number(d.slice(8));
  return (97 - (base % 97)) === cle;
}

/**
 * Statuts d'un emplacement. « Brouillon » couvre l'emplacement cree sans
 * disponibilites : il n'est pas reservable tant qu'on ne les a pas posees.
 */
const SPACE_STATES = {
  draft:     {key:'st.draft',     tone:'plain'},
  review:    {key:'st.review',    tone:'trust'},
  published: {key:'st.active',    tone:'trust'},
  paused:    {key:'st.suspended', tone:'lamp'}
};
const spaceStateLabel = sp => t((SPACE_STATES[sp.status] || SPACE_STATES.draft).key);
/**
 * Un emplacement ne recoit de demande que si TOUTES les conditions tiennent.
 * Elles sont independantes a dessein : un bike sitter approuve dont le nouvel
 * emplacement n'a pas ete regarde n'accueille pas, et un emplacement valide
 * dont le proprietaire est suspendu non plus.
 */
const isBookable = sp =>
  sp.status === 'published' &&
  !!(sp.open && sp.open.days.length) &&
  isVerified(sp.owner) &&
  isSitter(sp.owner) &&
  (USERS[sp.owner] || {}).status !== 'suspended';

/**
 * Ajouter quelqu'un a l'equipe d'un emplacement — colocation, commerce,
 * association. C'est la MODERATION qui approuve : si le proprietaire pouvait
 * ajouter qui il veut, la verification d'identite perdrait son sens, puisqu'il
 * suffirait d'un compte valide pour en faire entrer d'autres a la meme adresse.
 */
/** Demander qui inviter, avant de transmettre a la moderation. */
function askManager(spaceId){
  confirmAction("Inviter quelqu'un du même lieu",
    "Une colocation, un commerce, une association : plusieurs personnes peuvent tenir le même "
    + "emplacement. La modération vérifiera que cette personne habite ou travaille bien ici.",
    "Inviter Lucas D.",
    () => inviteManager(spaceId, 'lucas'));
}

function inviteManager(spaceId, who){
  const sp = spaceById(spaceId);
  if(!isOwner(sp)){ toast(MSG.notYours); return; }
  if(!USERS[who]){ toast("Ce membre n'existe pas."); return; }
  if(!isVerified(who)){ toast("Cette personne doit d'abord vérifier son identité."); return; }
  if(managersOf(sp).length >= MAX_MANAGERS){
    toast("Au-delà de " + MAX_MANAGERS + " personnes, écrivez-nous.");
    return;
  }
  if(managersOf(sp).includes(who)){ toast("Cette personne fait déjà partie de l'équipe."); return; }
  sp.pendingManagers = (sp.pendingManagers || []).concat(who);
  notify(who, publicName(sp.owner) + " vous invite à co-gérer son emplacement. "
    + "La modération vérifiera votre lien avec le lieu.", {screen:'myspaces'});
  toast("Invitation envoyée — la modération examinera le lien avec le lieu");
  render();
}

/** La moderation tranche : une preuve de domicile ou de travail commun. */
function decideManager(spaceId, who, accepte){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const sp = spaceById(spaceId);
  if(!sp) return;
  sp.pendingManagers = (sp.pendingManagers || []).filter(x => x !== who);
  if(accepte){
    sp.managers = (sp.managers || []).concat(who);
    notify(who, "Vous co-gérez désormais cet emplacement.", {screen:'myspaces'});
  } else {
    notify(who, "Votre co-gestion n'a pas été validée : le lien avec le lieu n'a pas pu "
      + "être établi.", {screen:'myspaces'});
  }
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(),
    action: accepte ? "Co-gestion validée" : "Co-gestion refusée",
    target:spaceId, reason:publicName(who), at:"aujourd'hui"});
  toast(accepte ? "Co-gestion validée" : "Refusée"); render();
}
/**
 * Combien de demandes ce bike sitter a laissees expirer sans repondre.
 * C'est la maladie des reseaux d'entraide : des emplacements qui restent
 * visibles alors que personne ne repond plus, et des membres qui s'en vont.
 */
const SILENCE_MAX = 3;
const unanswered = who => state.requests.filter(r =>
  r.host === who && r.status === 'EXPIRED').length;
/**
 * Un emplacement qui ne repond plus se met en pause de lui-meme.
 * C'est la maladie des reseaux d'entraide : des annonces qui restent visibles
 * alors que personne ne repond, et des membres qui s'en vont apres trois
 * demandes sans reponse. Mieux vaut une place en moins qu'une fausse promesse.
 */
function pauseIfSilent(who){
  const actifs = state.spaces.filter(sp => sp.owner === who && sp.status === 'published');
  if(!actifs.length) return;
  // Trois demandes sans reponse chez quelqu'un qui annonce accueillir souvent,
  // c'est un signal. Chez quelqu'un qui depanne de temps en temps, c'est normal.
  const occasionnel = actifs.every(sp => (sp.freq || 'regulier') === 'ponctuel');
  const seuil = occasionnel ? SILENCE_MAX * 3 : SILENCE_MAX;
  if(unanswered(who) < seuil) return;
  actifs.forEach(sp => { sp.status = 'paused'; });
  notify(who, SILENCE_MAX + " demandes sont restées sans réponse : vos emplacements sont mis "
    + "en pause. Republiez-les quand vous serez de nouveau disponible.",
    {screen:'myspaces'}, true);
  state.journal.unshift({id:'j'+(state.seq++), admin:'système',
    action:"Mise en pause automatique", target:who,
    reason:SILENCE_MAX + " demandes sans réponse", at:"aujourd'hui"});
}

/**
 * La presence humaine interdit d'etre disponible a deux endroits a la fois.
 * La regle vaut pour tous les emplacements d'un meme membre, domicile comme lieu
 * relais : c'est la personne qui repond, accueille et rend le velo, et elle
 * ne peut pas etre a deux endroits en meme temps.
 */
function ownerBusyElsewhere(sp, r){
  const other = state.spaces.filter(x =>
    x.owner === sp.owner && x.id !== sp.id);
  for(const x of other){
    const clash = state.requests.find(q =>
      q.spaceId === x.id && q.id !== r.id && HELD.includes(q.status) && overlap(q, r));
    if(clash) return x;
  }
  return null;
}

/** Places restantes sur le creneau de `r`, en ignorant `r` lui-meme. */
function capacityLeft(sp, r){
  if(ownerBusyElsewhere(sp, r)) return 0;
  const taken = state.requests.filter(x =>
    x.spaceId === sp.id && x.id !== r.id && HELD.includes(x.status) && overlap(x, r)).length;
  return sp.capacity - taken;
}
/** Motifs de refus d'une demande. Liste vide = demande valide. */
function requestIssues(sp, d){
  const out = accessIssues().slice();
  if(USERS[state.role].status === 'suspended')
    out.push("Votre compte est suspendu : vous ne pouvez pas envoyer de demande.");
  if(!u(state.role).verified.includes('Identité'))
    out.push("Vérifiez votre identité avant d'envoyer une demande.");
  if(!d.bike) out.push("Choisissez le vélo concerné.");
  // Deux gardes confirmees pour le meme velo au meme moment est impossible.
  if(d.bike && dejaConfirmee(state.role, d.bike, d, d.id)){
    const c = dejaConfirmee(state.role, d.bike, d, d.id);
    out.push("Ce vélo est déjà confié chez " + publicName(c.host)
      + " sur ce créneau. Annulez cette garde avant d'en demander une autre.");
  }
  // L'horizon vaut aussi pour une demande construite autrement que par le
  // calendrier : la regle tient dans les donnees, pas dans l'affichage.
  if(d.date && dateIndex(d.date) >= HORIZON_J)
    out.push("Les demandes de garde s'ouvrent " + HORIZON_J + " jours à l'avance.");
  // Une garde dure au moins une heure : en dessous, la remise et les deux
  // constats represente l'essentiel du rendez-vous.
  if(d.from && d.to && spanDays(d) === 1
    && (minutesOf(d.to) - minutesOf(d.from)) < GARDE_MIN_H * 60)
    out.push("Une garde dure au moins " + GARDE_MIN_H + " heure : le temps de se retrouver, "
      + "d'ouvrir et de faire les constats.");
  // On ne fait pas garder son velo chez soi, ni chez quelqu'un qu'on a bloque :
  // les deux passaient, et produisaient une garde impossible a mener.
  if(sp && sp.owner === state.role)
    out.push("C'est votre propre emplacement.");
  if(sp && (state.blocked || []).includes(sp.owner))
    out.push("Vous avez bloqué ce membre. Débloquez-le pour lui demander une garde.");
  // Une demande sans date ne veut rien dire : elle n'occupe aucun creneau et
  // n'apparait dans aucun calendrier.
  if(!d.date) out.push("Choisissez la date du dépôt.");
  if(!d.from || !d.to) out.push("Indiquez l'heure du dépôt et celle du retour.");
  const days = spanDays({date:d.date, dateTo:d.dateTo, from:d.from, to:d.to});
  const sameDay = days === 1;
  if(dateIndex(d.dateTo || d.date) < dateIndex(d.date))
    out.push("La date de récupération doit suivre celle du dépôt.");
  else if(sameDay && d.from >= d.to)
    out.push(MSG.orderTimes);
  else if(!withinHours(sp, d.date, d.from, d.to, d.dateTo))
    out.push("Créneau hors des disponibilités du bike sitter : " + openLabel(sp) + ".");
  if((d.repeat || 'none') !== 'none' && !acceptsRepeat(sp))
    out.push(publicName(sp.owner) + " n'accueille que des gardes ponctuelles.");
  if(isRelay(sp) && !sp.closedStorage && days > 1)
    out.push((sp.org ? sp.org.name : publicName(sp.owner))
      + " n'accueille que pendant ses heures d'ouverture : le dépôt et la récupération "
      + "doivent avoir lieu le même jour.");
  const max = sp.maxDays || 1;
  if(max !== NEGOTIABLE && days > max)
    out.push(publicName(sp.owner) + " accueille au maximum : " + MAX_DAYS[max].toLowerCase()
      + ". Votre demande porte sur " + days + " jours.");
  const elsewhere = ownerBusyElsewhere(sp, {id:null, spaceId:sp.id, date:d.date,
    dateTo:d.dateTo, from:d.from, to:d.to});
  if(elsewhere)
    out.push("Un vélo est déjà accueilli à un autre emplacement tenu par la même personne sur ce "
      + "créneau. Elle doit être présente, et ne peut pas l'être à deux endroits à la fois.");
  else if(capacityLeft(sp, {id:null, date:d.date, dateTo:d.dateTo, from:d.from, to:d.to, spaceId:sp.id}) <= 0)
    out.push("Plus de place sur ce créneau. Une place déjà réservée reste indisponible "
      + BUFFER_MIN + " minutes avant et après, pour que personne ne se croise devant la porte.");
  return out;
}
/** Emplacements reellement disponibles sur le creneau cherche. */
/** « 400 m », « 1,2 km » : une distance affichee redevient un nombre de metres. */
function metersOf(sp){
  const d = String(sp.dist || '').replace(',', '.');
  const v = parseFloat(d);
  if(isNaN(v)) return Infinity;
  return /km/.test(d) ? v * 1000 : v;
}
const DISTANCES = [
  {key:500,  label:'moins de 500 m'},
  {key:1000, label:"moins d'1 km"},
  {key:2000, label:'moins de 2 km'}
];

function matchingSpaces(){
  const q = state.search, f = state.filters;
  const needle = (q.q||'').toLowerCase().trim();
  return state.spaces.filter(sp => {
    // Un emplacement sans jour d'accueil est un brouillon : il ne sort jamais.
    if(!isBookable(sp)) return false;
    if(sp.owner === state.role) return false;
    if(state.blocked.includes(sp.owner)) return false;
    if(USERS[sp.owner].status === 'suspended') return false;
    if(!withinHours(sp, q.date, q.from, q.to, q.dateTo)) return false;
    if(!onRequest(sp) && spanDays({date:q.date, dateTo:q.dateTo}) > (sp.maxDays || 1)) return false;
    // Le multi-jours n'est pas le cas standard : il s'ouvre a la demande.
    if(spanDays({date:q.date, dateTo:q.dateTo}) > 1 && !sp.multiDay) return false;
    // Sur une seule journee, la duree d'affilee compte autant que le nombre de
    // jours : celui qui depanne deux heures n'accueille pas de 7 h a 20 h.
    if(spanDays({date:q.date, dateTo:q.dateTo}) === 1
      && (minutesOf(q.to) - minutesOf(q.from)) / 60 > (sp.maxHours || 24)) return false;
    if(capacityLeft(sp, {id:null, spaceId:sp.id, date:q.date, dateTo:q.dateTo,
        from:q.from, to:q.to}) <= 0) return false;
    const zone = resolveZone(needle);
    if(zone && !zone.includes(sp.city)) return false;
    if(f.anchor && !sp.anchor) return false;
    if(f.maxDist && metersOf(sp) > f.maxDist) return false;
    if(f.bikeType && !sp.bikes.includes(f.bikeType)) return false;
    if(f.covered && sp.weather !== 'interieur') return false;
    if(f.freeOnly && feesOn() && sp.fee && sp.fee.amount) return false;
    return true;
  });
}
/**
 * Faute de geocodage dans le prototype, une recherche est resolue en zone.
 * Un point d'interet rayonne sur les communes voisines : chercher
 * « Bruxelles-Central » doit remonter Ixelles, qui est a quelques centaines
 * de metres. Une requete inconnue ne restreint rien.
 */
const ZONES = [
  [['bruxelles-central','central','grand-place','sainte-catherine','centre'], ['Bruxelles','Ixelles']],
  [['flagey','ixelles','matonge'], ['Ixelles','Bruxelles']],
  [['saint-gilles','parvis','midi'], ['Saint-Gilles','Bruxelles']],
  [['bruxelles'], ['Bruxelles','Ixelles','Saint-Gilles']]
];
function resolveZone(needle){
  if(!needle) return null;
  for(const [keys, cities] of ZONES){
    if(keys.some(k => needle.includes(k))) return cities;
  }
  const city = [...new Set(state.spaces.map(x=>x.city))].find(c => needle.includes(c.toLowerCase()));
  return city ? [city] : null;
}

function toggleFilter(key, value){
  // Les cases a cocher basculent ; les listes se vident quand on reclique le meme choix.
  if(key === 'covered' || key === 'anchor' || key === 'freeOnly'){
    state.filters[key] = !state.filters[key];
  } else if(key === 'maxDist'){
    const v = Number(value);
    state.filters.maxDist = state.filters.maxDist === v ? 0 : v;
  } else {
    state.filters[key] = state.filters[key] === value ? '' : value;
  }
  render();
}
function resetFilters(){
  state.filters = {anchor:false, maxDist:0, bikeType:'', freeOnly:false, covered:false};
  render();
}
/**
 * Les filtres, groupes par question et toujours dans le meme ordre :
 * le lieu, le velo, puis la securite. Melanges, ils obligent a relire la
 * liste entiere pour retrouver un critere.
 */
/**
 * Les filtres, groupes par question et toujours dans le meme ordre :
 * d'abord la distance — c'est le premier critere quand on cherche ou laisser
 * son velo —, puis le velo a garer, puis la securite. Le type de lieu a ete
 * retire : il ne discriminait presque rien et repetait ce que la securite dit
 * deja.
 */
function filterGroups(){
  // Les velos du membre passent devant : l'application les connait deja.
  const mine = [...new Set(myBikes().map(b => b.type))];
  const bikes = [...mine, ...BIKE_TYPES.filter(t => !mine.includes(t))];
  const g = [
    {label:"Distance", key:'maxDist',
     values: DISTANCES.map(d => ({value:d.key, label:d.label}))},
    {label:"Vélo à confier", key:'bikeType',
     values: bikes.map(t => ({value:t, label:t, mine:mine.includes(t)}))},
    {label:"Sécurité", flags:[['covered', "À l'intérieur"], ['anchor', "Point d'ancrage"]]}
  ];
  if(feesOn()) g.push({label:"Contribution", flags:[['freeOnly', "Sans contribution"]]});
  return g;
}
const filtersActive = () => {
  const f = state.filters;
  return !!(f.anchor || f.maxDist || f.bikeType || f.freeOnly || f.covered);
};

/** Combien de resultats ce filtre laisserait-il, tout le reste inchange. */
function countWith(key, value){
  const saved = {...state.filters};
  state.filters = {...saved};
  if(key === 'covered' || key === 'anchor' || key === 'freeOnly')
    state.filters[key] = !saved[key];
  else if(key === 'maxDist')
    state.filters.maxDist = saved.maxDist === Number(value) ? 0 : Number(value);
  else
    state.filters[key] = saved[key] === value ? '' : value;
  const n = matchingSpaces().length;
  state.filters = saved;
  return n;
}

function chipFor(key, value, label, extra){
  const flag = key === 'covered' || key === 'anchor' || key === 'freeOnly';
  const on = flag ? state.filters[key] : state.filters[key] === value;
  const n = countWith(key, value);
  const dead = !on && n === 0;
  return '<button class="chip'+(on ? ' on' : '')+(dead ? ' dead' : '')+'"'
    + (dead ? ' disabled' : '')
    + ' onclick="toggleFilter(\''+key+'\',\''+String(value).replace(/'/g, "\\'")+'\')">'
    + esc(label)+(extra ? ' <span class="chip-n">'+esc(extra)+'</span>' : '')
    + ' <span class="chip-n">'+n+'</span></button>';
}

/** Version groupee, avec un intitule par question. Utilisee sur l'ecran dedie. */
function filterSections(){
  let h = '';
  filterGroups().forEach(g => {
    h += '<p class="t-xs muted" style="margin:14px 0 6px">'+esc(g.label)+'</p><div class="chips">';
    if(g.values)
      h += g.values.map(v => chipFor(g.key, v.value, v.label, v.mine ? 'le mien' : '')).join('');
    else
      h += g.flags.map(([k, l]) => chipFor(k, true, l)).join('');
    h += '</div>';
  });
  if(filtersActive())
    h += '<button class="btn ghost sm" style="width:100%;margin-top:16px" '
      + 'onclick="resetFilters()">Tout effacer</button>';
  return h;
}

/** Version compacte, sur une ligne, dans le meme ordre. Utilisee sur les resultats. */
function filterChips(){
  let h = '<div class="chips">';
  filterGroups().forEach(g => {
    h += g.values ? g.values.map(v => chipFor(g.key, v.value, v.label)).join('')
                  : g.flags.map(([k, l]) => chipFor(k, true, l)).join('');
  });
  if(filtersActive()) h += '<button class="chip" onclick="resetFilters()">Tout effacer</button>';
  return h + '</div>';
}

/** Ce que les filtres actifs disent, en une ligne. */
function filterSummary(){
  const f = state.filters, out = [];
  if(f.maxDist)   out.push((DISTANCES.find(d => d.key === f.maxDist)||{}).label);
  if(f.bikeType)  out.push(f.bikeType);
  if(f.covered)   out.push("À l'intérieur");
  if(f.anchor)    out.push("Point d'ancrage");
  if(f.freeOnly && feesOn()) out.push('Sans contribution');
  return out.length ? out.join(', ') : 'Distance, vélo, sécurité…';
}

function formatDate(iso){
  const parts = String(iso).split('-');
  if(parts.length !== 3) return iso;
  return (+parts[2]) + ' ' + (MONTHS[(+parts[1])-1] || '') + ' ' + parts[0];
}

  heure: {label:"de l'heure",      short:"€/h"},
