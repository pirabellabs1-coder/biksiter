const PHOTO_LABELS = ["Vue générale", "Zone des vélos", "Entrée et fermeture",
  "Point d'ancrage", "Équipements de sécurité"];
function addPhoto(){
  const d = state.wizard.data;
  d.photoList.push({label: PHOTO_LABELS[Math.min(d.photoList.length, PHOTO_LABELS.length-1)]});
  d.photos = d.photoList.length;
  render();
}
function dropPhoto(i){
  const d = state.wizard.data;
  d.photoList.splice(i,1); d.photos = d.photoList.length; render();
}
function movePhoto(i, dir){
  const d = state.wizard.data, j = i + dir;
  if(j < 0 || j >= d.photoList.length) return;
  [d.photoList[i], d.photoList[j]] = [d.photoList[j], d.photoList[i]];
  render();
}
function setAddr(k, v){ state.wizard.data.addr[k] = v; render(); }
function setWizSpot(v){ state.wizard.data.spot = v; render(); }
function setAnchorKind(v){ state.wizard.data.anchorKind = v; render(); }
function setAccess(v){ state.wizard.data.access = v; render(); }
function toggleSecurityExtra(v){
  const a = state.wizard.data.securityExtra;
  const i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); render();
}
function toggleService(v){
  const a = state.wizard.data.services;
  const i = a.indexOf(v);
  i<0 ? a.push(v) : a.splice(i,1);
  // On previent au moment ou l'on coche, pas dans les conditions generales que
  // personne ne lit : c'est le seul moment ou l'avertissement sert a quelque chose.
  if(i < 0 && v === 'Recharge VAE') toast(RECHARGE_AVERTISSEMENT);
  render();
}
function toggleVow(k){
  const a = state.wizard.data.vows;
  const i = a.indexOf(k); i<0 ? a.push(k) : a.splice(i,1); render();
}
/** Ce qui empeche de passer a l'etape suivante. */
function stepBlocked(){
  const d = state.wizard.data, st = state.wizard.step;
  if(st===1) return !d.spot || !d.addr.street || !d.addr.zip || !d.addr.city
    || (isRelay(d) && (!d.org.name || !d.org.number || !d.allowed));
  if(st===2) return !d.bikes.length
    || (d.bikes.some(b=>BULKY.includes(b)) && !d.bulkyOk);
  if(st===3) return !d.lock || !d.weather;
  if(st===4) return !d.access || (d.hardAccess && !(d.accessNote||'').trim());
  return false;
}
function wizStep(n){
  if(n > 0 && stepBlocked()) return;
  state.wizard.step = Math.min(WIZ_STEPS.length, Math.max(1, state.wizard.step + n));
  scrollTop(); render();
}

function freshSpaceDraft(){

/** Une capacite se compte en velos entiers, entre 1 et 6. */
const MAX_CAPACITY = 6;

/*
 * Trois questions ferment la porte, les autres informent.
 * On ne demande pas « est-ce privé ? » — la question appellerait toujours oui.
 * On demande qui peut entrer, ce qui se verifie sur une photo.
 */
const ELIMINATOIRES = [
  {cle:'publicAccess', question:"Le public peut-il accéder à cet emplacement ?",
   refusSi:true,  motif:"Un emplacement accessible au public ne peut pas accueillir de vélo."},
  {cle:'sharedAccess', question:"D'autres résidents de l'immeuble peuvent-ils y accéder ?",
   refusSi:true,  motif:"Un local partagé avec d'autres résidents ne remplit pas la règle de l'espace privé."},
  {cle:'lockable',     question:"L'emplacement ferme-t-il à clé ?",
   refusSi:false, motif:"Un emplacement qui ne ferme pas ne peut pas accueillir de vélo."}
];

/*
 * La recharge de batterie : une option que le bike sitter propose, ou non.
 *
 * Elle est fermee par defaut — la plupart des gardes n'en ont pas besoin, le
 * velo attend quelques heures — mais elle a de la valeur pour celui qui vient
 * de loin en velo electrique.
 *
 * Celui qui l'ouvre est prevenu de ce qu'elle engage : un chargeur qu'il n'a
 * pas choisi, une batterie dont il ignore l'entretien, et une charge qu'il
 * faudrait surveiller. Un feu de lithium redemarre apres extinction apparente.
 * C'est sa decision, pas la notre — mais elle se prend en connaissance de
 * cause.
 */
const RECHARGE_AVERTISSEMENT =
  "En acceptant la recharge, vous chargez une batterie dont vous ne connaissez "
  + "ni l'état ni l'entretien. Ne la laissez jamais sans surveillance, et "
  + "vérifiez que votre assurance habitation ne l'exclut pas.";

function wizardIssues(){
  const d = (state.wizard && state.wizard.data) || {};
  const out = accessIssues().slice();
  // Un emplacement qui accueille zero velo n'est pas un emplacement, et un
  // garage a 999 places n'existe pas : les deux passaient jusqu'ici.
  // Les trois questions fermantes, avant tout le reste.
  ELIMINATOIRES.forEach(q => {
    if(d[q.cle] === undefined){ out.push(q.question); return; }
    if(d[q.cle] === q.refusSi) out.push(q.motif);
  });
  // Le second emplacement suppose un lieu professionnel identifie.
  // On compte les emplacements qui existent vraiment — un brouillon jamais
  // envoye n'est pas une adresse.
  const dejaPublies = mySpaces().filter(sp => sp.status !== 'draft').length;
  if(dejaPublies >= 1){
    if(!isRelay(d))
      out.push("Un second emplacement n'est possible que pour un commerce, une association "
        + "ou un atelier — on n'habite qu'à un endroit.");
    else if(!validEnterpriseNumber(d.org && d.org.number))
      out.push("Le numéro d'entreprise doit comporter dix chiffres valides.");
  }
  // Le droit d'utiliser le lieu : une declaration horodatee, pas un document.
  if(!d.rightToUse)
    out.push("Confirmez que vous êtes autorisé à utiliser cet emplacement pour garder des vélos.");
  // Ce qui distingue une garde d'un parking : quelqu'un remet le velo, quelqu'un
  // le recoit. Sans presence a la remise, l'emplacement devient une consigne.
  if(!(d.vows || []).includes('remise'))
    out.push("Une garde suppose une remise en main propre : confirmez votre présence "
      + "au dépôt et à la reprise.");
  // La recharge se propose, elle ne s'impose pas. Une seule contrainte : elle
  // suppose d'accepter les velos electriques, sinon l'option ne veut rien dire.
  if((d.services || []).includes('Recharge VAE') && !(d.bikes || []).includes('Électrique'))
    out.push("Pour proposer la recharge, acceptez d'abord les vélos électriques.");
  const cap = Number(d.capacity);
  if(!Number.isInteger(cap) || cap < 1)
    out.push("Indiquez combien de vélos vous pouvez accueillir, au moins un.");
  else if(cap > MAX_CAPACITY)
    out.push("Au-delà de " + MAX_CAPACITY + " vélos, écrivez-nous : ce n'est plus "
      + "un accueil entre voisins.");
  if(USERS[state.role].status === 'suspended') out.push("Votre compte est suspendu.");
  if(!u(state.role).verified.includes('Identité'))
    out.push("Vérifiez votre identité pour publier un emplacement.");
  if(mySpaces().length >= MAX_SPACES)
    out.push("Vous proposez déjà " + MAX_SPACES + " emplacements. Suspendez-en un pour "
      + "en ajouter un autre.");
  if(!isRelay(d) && !d.spot) out.push("Indiquez où les vélos seront gardés.");
  if(!d.addr || !d.addr.street || !d.addr.zip || !d.addr.city)
    out.push("Complétez l'adresse de l'emplacement.");
  if((d.photoList ? d.photoList.length : (d.photos||0)) < 2)
    out.push("Ajoutez au moins deux photos : une vue générale et la zone des vélos.");
  if((d.desc||'').trim().length < 80)
    out.push("La description doit faire au moins 80 caractères.");
  if(!(d.bikes||[]).length) out.push("Indiquez au moins un type de vélo accepté.");
  if((d.vows||[]).length < 3) out.push("Confirmez les trois engagements avant de publier.");
  if(isRelay(d)){
    if(!(d.org && d.org.name)) out.push("Indiquez le nom de la structure.");
    if(!(d.org && d.org.number)) out.push("Indiquez le numéro d'entreprise ou d'ASBL.");
    else if(!validEnterpriseNumber(d.org.number))
      out.push("Ce numéro d'entreprise n'est pas valide : dix chiffres, clé comprise.");
    if(!d.allowed) out.push("Confirmez que vous êtes autorisé à accueillir des vélos ici.");
  }
  return out;
}

function publishSpace(){
  const d = state.wizard.data;
  const issues = wizardIssues();
  if(issues.length){ toast(issues[0]); return; }
  const spot = d.spot === "Autre espace privé" && d.spotOther ? d.spotOther : d.spot;

  if(d.lock && d.lock !== 'aucun') security.push(LOCK_KINDS[d.lock]);

    addr: Object.assign({}, d.addr),

    city: d.addr.city || 'Bruxelles',

    bikes:d.bikes.slice(), security, desc:d.desc,
    lock:d.lock, weather:d.weather, anchor:!!d.anchor, anchorKind:d.anchorKind||'',
    anchorEach:!!d.anchorEach, securityExtra:(d.securityExtra||[]).slice(),
    access:d.access, hardAccess:!!d.hardAccess, accessNote:d.accessNote||'',
    plug:!!d.plug, services:(d.services||[]).slice(),
    photoList:(d.photoList||[]).slice(),

    exceptions:(d.exceptions||[]).slice(),
    open:{days:d.days.slice(), from:d.from, to:d.to, hours:d.hours||null},
    closures:(d.closures||[]).slice(),

    exclusive:!!d.exclusive,

    reply:d.reply||'jour', fee:d.fee||null, freq:d.freq||'regulier', maxDays:d.maxDays||1,

const PERIODS = [['24',"24 h",24],['7',"7 jours",168],['30',"30 jours",720],['365',"12 mois",8760]];
function matchingThefts(){
  const f = state.theftFilters;
  const max = (PERIODS.find(p=>p[0]===f.period)||PERIODS[1])[2];
  return state.thefts.filter(t =>
    t.status === 'active'
    && (t.ageH||0) <= max
    && (!f.city || t.city === f.city)
    && (!f.type || t.type === f.type));
}
function theftFilter(key, value){
  state.theftFilters[key] = (state.theftFilters[key] === value && key !== 'period') ? '' : value;
  render();
}

/** Le proprietaire peut ecrire a l'observateur sans qu'aucune coordonnee circule. */
function writeToSighting(theftId, observer){
  if(!observer || !USERS[observer]){ toast("Cette observation est anonyme."); return; }
  const c = openConvo('sighting', state.role, observer, theftId);
  if(!(state.messages[c.id]||[]).length){
    state.messages[c.id] = [{from:state.role,
      text:"Bonjour, merci d'avoir signalé mon vélo. Pouvez-vous m'en dire plus ?", at:clock()}];
  }
  notify(observer, "Le propriétaire du vélo vous a écrit.");
  state.tab='messages'; state.back=[]; state.screen='thread'; state.param=c.id;
  scrollTop(); render();
}
/**
 * Un velo est declare vole : les membres du quartier sont prevenus.
 * C'est la seule chance reelle de le reconnaitre — un vol se joue dans les
 * premieres heures, et personne ne consulte une galerie spontanement.
 */
function announceTheft(t){
  let sent = 0;
  neighbours(t.city, t.owner).forEach(p => {
    if(!wants(p.id, 'theft')) return;
    notify(p.id, "Vélo volé près de chez vous : " + t.brand + " " + t.type.toLowerCase()
      + " " + t.color.toLowerCase() + ", " + publicPlace(t) + ". Ouvrez l'œil.",
      {screen:'theft', param:t.id});
    sent++;
  });
  return sent;
}

function recoverTheft(id){
  const t0 = theftById(id);
  // Une fiche se cloture par celui qui l'a declaree, ou par la moderation.
  if(!isModerator() && (!t0 || t0.owner !== state.role)){
    toast("Cette fiche n'est pas la vôtre."); return;
  }
  const t = theftById(id);
  t.status = t.status==='recovered'?'active':'recovered';
  toast(t.status==='recovered'?"Fiche close. Merci !":"Fiche rouverte"); render();
}

function decideIdentity(id, decision){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const q = state.identityQueue.find(x=>x.id===id);
  q.status = decision;
  if(decision==='verified'){
    if(!USERS[q.user].verified.includes('Identité')) USERS[q.user].verified.push('Identité');
    USERS[q.user].account = 'active';
    setIdentity(q.user, 'verified');
    recordVerification(q.user, 'moderation', q.id);
    if(USERS[q.user].sponsor) notify(USERS[q.user].sponsor,
      publicName(q.user) + " a rejoint le réseau grâce à votre invitation.");
  } else {
    USERS[q.user].account = 'rejected';
    setIdentity(q.user, 'rejected');
  }
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(),
    action: decision==='verified'?"Vérification d'identité approuvée":"Vérification d'identité rejetée",
    target:q.user, reason:'—', at:"aujourd'hui"});
  notify(q.user, decision==='verified'
    ? "Votre compte est actif. Bienvenue dans le réseau."
    : "Pièce refusée : photo illisible. Vous pouvez en renvoyer une.", {screen:'verif'});
  toast("Décision enregistrée · document supprimé"); render();
}

/**
 * Demenager.
 * L'identite tient — c'est la meme personne. Le nouveau lieu, lui, n'a jamais
 * ete regarde : il repart en validation. Sans cette regle, il suffirait de
 * changer d'adresse pour accueillir n'importe ou.
 */
/**
 * Autoriser quelqu'un d'autre a reprendre le velo.
 *
 * Le bike sitter ne remet jamais un velo parce qu'une personne affirme « c'est
 * Thomas qui m'envoie ». Le proprietaire designe son mandataire dans le
 * garde : son prenom apparait chez le bike sitter, et c'est le
 * mandataire qui saisit le code de restitution.
 *
 * Aucun mecanisme nouveau : le code appartient toujours a celui qui remet le
 * velo, et il est saisi par celui qui le recoit — mandataire compris.
 */
/** Demander qui viendra, ou retirer l'autorisation posee. */
/** Confirmer un demenagement avant de renvoyer le lieu en validation. */
function askMove(id){
  confirmAction("J'ai déménagé",
    "Votre emplacement repartira en validation : nous n'avons jamais regardé cette adresse. "
    + "Votre identité, elle, reste vérifiée.",
    "Changer d'adresse",
    () => moveSpace(id, {street:'Nouvelle adresse', number:'1', zip:'1050', city:'Ixelles'}));
}

function askProxy(id){
  const r = reqById(id);
  if(!r) return;
  if(r.proxy){ setProxy(id, ''); return; }
  confirmAction("Autoriser une reprise",
    "Indiquez le prénom de la personne qui viendra. Le bike sitter le verra, et ne "
    + "remettra le vélo qu'à elle — avec le même code que pour vous.",
    "Autoriser Camille",
    () => setProxy(id, 'Camille'));
}

function setProxy(id, prenom, tel){
  const r = reqById(id);
  if(!r){ toast("Stationnement introuvable."); return; }
  // Seul le proprietaire du velo mandate : ni le bike sitter ni un tiers.
  if(r.cyclist !== state.role){
    toast("Seul le propriétaire du vélo peut désigner quelqu'un.");
    return;
  }
  if(!ENGAGE.includes(r.status)){
    toast("Cette garde n'est plus en cours.");
    return;
  }
  const nom = (prenom || '').trim();
  if(!nom){ delete r.proxy; toast("Autorisation retirée"); render(); return; }
  r.proxy = {name: nom, phone: (tel||'').trim(), at: clock()};
  r.events.push({from:r.status, to:r.status, actor:'cyclist',
    at:clock(), note:"Reprise autorisée à " + nom});

    + " à venir reprendre le vélo. Demandez-lui le code comme d'habitude.",
    {screen:'detail', param:r.id});
  toast(nom + " est autorisé à reprendre le vélo");
  render();
}

function moveSpace(id, nouvelleAdresse){
  const sp = spaceById(id);
  if(!isOwner(sp)){ toast(MSG.notYours); return; }
  const engagees = state.requests.filter(r =>
    r.spaceId === id && ENGAGE.includes(r.status));
  if(engagees.length){
    toast("Terminez les gardes en cours avant de changer d'adresse.");
    return;
  }
  sp.addr = Object.assign({}, nouvelleAdresse);
  sp.address = [sp.addr.street, sp.addr.number].filter(Boolean).join(' ')
    + ', ' + sp.addr.zip + ' ' + sp.addr.city;
  sp.approx = "à environ 300 m du centre de " + (sp.addr.city || 'Bruxelles');
  sp.city = sp.addr.city || 'Bruxelles';
  sp.status = 'review';
  state.journal.unshift({id:'j'+(state.seq++), admin:'système',
    action:"Changement d'adresse", target:id,
    reason:"Emplacement renvoyé en validation", at:"aujourd'hui"});
  notify(state.role, "Votre nouvelle adresse doit être examinée avant d'accueillir. "
    + "Votre identité, elle, reste vérifiée.", {screen:'myspaces'});

}

/**
 * Re-verifier une identite. Quatre cas seulement, et jamais automatiquement :
 * un signalement grave, une suspicion de fraude, une exigence d'assureur, une
 * piece devenue invalide. Pas de re-verification periodique : elle coute de la
 * friction sans rien prouver de plus.

function requireReverification(id, motif){
  if(!isModerator()){ toast(MSG.notModerator); return; }

    submitted:"aujourd'hui", status:'pending', reason:motif || 'Re-vérification'});

    action:"Re-vérification demandée", target:id, reason:motif || '—', at:"aujourd'hui"});

    + ". Vos emplacements n'accueillent pas en attendant.", {screen:'verif'}, true);

function adminResolve(id, to){
  // Le back-office n'agit pas parce qu'on connait le nom d'une fonction.
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const r = reqById(id);
  r.events.push({from:r.status, to, actor:'admin', at:clock()});
  r.status = to;
  // La garde est due, ou elle ne l'est pas : un litige tranche ne laisse pas
  // les maillons geles.
  if(r.links){
    if(to === 'COMPLETED'){ r.links.frozen = false; }
    else { delete r.links; }
  } else if(to === 'COMPLETED'){
    grantLinks(r);
  }
  state.reports.filter(p=>p.target===id && p.status!=='resolved').forEach(p=>{ p.status='resolved'; });
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Litige tranché",
    target:id, reason:"Clos en "+statusLabel(to), at:"aujourd'hui"});
  notify(r.cyclist, "Votre litige a été tranché : "+statusLabel(to)+".");
  notify(r.host, "Le litige a été tranché : "+statusLabel(to)+".");
  toast("Litige tranché et journalisé"); render();
}
function adminForceClose(id){
  // Le back-office n'agit pas parce qu'on connait le nom d'une fonction.
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const r = reqById(id);
  r.events.push({from:r.status, to:'COMPLETED', actor:'admin', at:clock()});
  grantLinks(r);
  r.status='COMPLETED';
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Clôture forcée d'une garde",

/** Une suspension a des effets reels : emplacements depublies, actions bloquees. */
/** La decision demande confirmation ; l'execution est une fonction distincte. */
function toggleSuspend(id){
  const p = USERS[id];
  if(p.status === 'suspended'){ doUnsuspend(id); return; }
  confirmAction("Suspendre "+p.name,
    "Ses emplacements seront dépubliés et ses demandes en attente annulées. L'action est journalisée.",
    "Suspendre le compte",
    () => doSuspend(id));
}
function doSuspend(id){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const p = USERS[id];
  p.status = 'suspended';
  state.spaces.filter(sp=>sp.owner===id && sp.status==='published').forEach(sp=>{ sp.status='paused'; });
  state.requests.filter(r=>(r.cyclist===id||r.host===id) && r.status==='PENDING')
    .forEach(r=>{ apply(r,'CANCELLED','admin'); r.reason = "Compte suspendu."; });
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Compte suspendu",
    target:id, reason:'Décision de modération', at:"aujourd'hui"});
  notify(id, "Votre compte est suspendu. Vos emplacements ont été dépubliés.");
  toast(p.name + " suspendu · emplacements dépubliés");
  render();
}
function doUnsuspend(id){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const p = USERS[id];
  p.status = 'active';
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Compte réactivé",
    target:id, reason:'—', at:"aujourd'hui"});
  notify(id, "Votre compte est de nouveau actif. Republiez vos emplacements depuis « Mes emplacements ».");
  toast(p.name + " réactivé");
  render();
}

/* Traduction posee sur le rendu — voir PHRASES ci-dessus. */
/*
 * Les segments.
 *
 * Beaucoup de phrases sont assemblees a l'execution : « Chez Manoelle V. ·
 * 05/09/2026 · 09:00 → 17:00 ». Elles ne figurent nulle part telles quelles.
 * On traduit donc aussi morceau par morceau, du plus long au plus court, pour
 * qu'un fragment court ne vienne pas casser un fragment long.
 */
const SEGMENTS_TRIES = {};
function segmentsDe(langue){
  if(SEGMENTS_TRIES[langue]) return SEGMENTS_TRIES[langue];
  const t = MOTS[langue] || {};
  // Bornes de mot : sinon « jour » transforme « journal » en « dagnal ».
  const echappe = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  SEGMENTS_TRIES[langue] = Object.keys(t).sort((a, b) => b.length - a.length)
    .map(k => {
      // Le trait d'union fait partie du mot : sinon « Ville » se remplace dans
      // « centre-ville », qui devient « centre-Stad ».
      const avant = /^[a-zà-ÿ]/i.test(k) ? '(?<![a-zà-ÿ-])' : '';
      const apres = /[a-zà-ÿ]$/i.test(k) ? '(?![a-zà-ÿ-])' : '';
      return [new RegExp(avant + echappe(k) + apres, 'gi'), t[k], k.length];
    });
  return SEGMENTS_TRIES[langue];
}

/** Le nom d'un type de velo, dans la langue courante. */
function typeVelo(nom){
  const t = MOTS[state.locale];
  return (t && t[nom]) || nom;
}
function listeVelos(arr){ return (arr || []).map(typeVelo).join(', '); }

function traduire(html){
  const table = PHRASES[state.locale];
  if(!table) return html;
  // On decoupe sur les balises : seul ce qui est entre deux balises est du
  // texte lu par quelqu'un.
  return html.replace(/>([^<]+)</g, (tout, texte) => {
    const brut = texte.trim();
    if(!brut) return tout;
    const t = table[brut];
    if(t) return tout.replace(brut, t);
    // Pas de correspondance exacte : on traduit les morceaux reconnus.
    // Les segments ne servent qu'aux libelles assembles — « 3 vélos · 400 m ».
    // Sur une phrase entiere, ils produiraient du franglais : « un fiets », et
    // une phrase entierement francaise vaut mieux qu'une phrase a moitie
    // traduite.
    // Sur une phrase longue, seuls les fragments longs s'appliquent : ils sont
    // assez distinctifs pour ne pas produire de franglais, et ils permettent de
    // traduire une phrase qui contient un prenom insere a l'execution.
    const seuil = brut.length > 60 ? 25 : 0;
    let x = brut;
    segmentsDe(state.locale).forEach(([re, tr, taille]) => {
      if(taille >= seuil) x = x.replace(re, tr);
    });
    return x === brut ? tout : tout.replace(brut, x);
  });
}

function render(){
  if(!theftsOn() && THEFT_SCREENS.includes(state.screen))
    state.screen = state.role === 'guest' ? 'gate'
                 : state.role === 'admin' ? 'admin' : 'explore';
  if(state.role === 'guest' && !PUBLIC_SCREENS.includes(state.screen)) state.screen = 'gate';
  const fn = S[state.screen] || S.explore;
  document.getElementById('app').innerHTML = traduire(connectionBanner() + fn());
  const phone = document.getElementById('phone');
  phone.className = 'phone' + (state.screen==='admin' ? ' wide' : '');
  const tabsEl = document.getElementById('tabs');
  const showTabs = !['guest','admin'].includes(state.role) && state.screen!=='index';
  if(!showTabs){ tabsEl.innerHTML=''; tabsEl.style.display='none'; return; }
  tabsEl.style.display='flex';
  const n = unreadCount();
  tabsEl.innerHTML = TABS.map(([id,key,glyph]) =>
    '<button class="'+(state.tab===id?'on':'')+'" onclick="tab(\''+id+'\')">'
    + '<span class="glyph">'+glyph+'</span>'+t(key)
    + ((id==='activity'&&n) || (id==='messages'&&convoCount()) ? '<span class="dot"></span>':'')+'</button>').join('');
}
render();
</script>
