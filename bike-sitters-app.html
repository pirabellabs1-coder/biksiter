/**
 * Le bike sitter fixe librement son montant et son unite.
 * La seule regle : le total demande ne depasse jamais FEE_MAX par journee.
 */
function feeIssues(fee){
  if(!fee || !fee.amount) return [];
  if(!FEE_UNITS[fee.unit]) return ["Choisissez une unité : heure, demi-journée ou journée."];
  if(isNaN(fee.amount) || fee.amount < 0) return ["Indiquez un montant valide, ou laissez gratuit."];
  if(fee.amount > FEE_MAX)
    return ["Une contribution ne peut pas dépasser " + FEE_MAX + " € par journée."];
  return [];
}
/**
 * Ce que le cycliste paiera pour la garde, plafonne a FEE_MAX par journee.
 * Le plafond s'applique jour par jour : trois journees ne peuvent pas depasser
 * trois fois FEE_MAX, et une seule journee jamais FEE_MAX.
 */
function feeFor(sp, from, to, days){
  if(!feesOn() || !sp.fee || !sp.fee.amount) return 0;
  const nights = Math.max(1, days || 1);
  let perDay;
  if(sp.fee.unit === 'heure'){
    const hours = Math.max(1, Math.ceil((minutesOf(to) - minutesOf(from)) / 60));
    // Sur plusieurs journees, on facture la journee pleine sauf la derniere.
    perDay = nights > 1 ? sp.fee.amount * 12 : sp.fee.amount * hours;
  } else if(sp.fee.unit === 'demi'){
    const hours = Math.max(1, Math.ceil((minutesOf(to) - minutesOf(from)) / 60));
    perDay = nights > 1 ? sp.fee.amount * 2 : sp.fee.amount * (hours > 5 ? 2 : 1);
  } else {
    perDay = sp.fee.amount;
  }
  return Math.min(perDay, FEE_MAX) * nights;
}

/**
 * Horaires du jour pour un emplacement.
 * `open.hours` autorise un horaire different par jour — un commerce ferme a
 * 18:00 en semaine et 20:00 le vendredi. A defaut, open.from/open.to valent
 * pour tous les jours ouverts. Une fermeture exceptionnelle prime sur tout.
 */
function hoursForDay(sp, dateLabel){
  const o = sp.open; if(!o) return null;
  if((sp.closures || []).includes(dateLabel)) return null;
  const wd = weekdayOf(dateLabel);
  if(!o.days.includes(wd)) return null;
  return (o.hours && o.hours[wd]) ? o.hours[wd] : {from:o.from, to:o.to};
}
/** Libelle des horaires d'un emplacement, en regroupant les jours identiques. */
function openLabel(sp){
  const o = sp.open; if(!o) return '—';
  const names = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const groups = {};
  o.days.slice().sort().forEach(wd => {
    const h = (o.hours && o.hours[wd]) || {from:o.from, to:o.to};
    const key = h.from + ' → ' + h.to;
    (groups[key] = groups[key] || []).push(names[wd]);
  });
  return Object.entries(groups).map(([h, ds]) => ds.join(', ') + ' · ' + h).join('   ');
}

/*
 * La duree acceptee, en heures, a l'interieur d'une journee.
 *
 * Sans ce cran, celui qui depanne le temps d'une course et celui qui garde
 * pendant une journee de travail sont melanges : le premier refuse des demandes
 * en serie, et finit mis en pause pour silence.
 *
 * C'est aussi ce qui distingue une garde d'un parking : quelqu'un accepte une
 * duree, il ne loue pas un metre carre a l'heure.
 */
/*
 * Les heures se choisissent dans une liste, pas dans un champ natif.
 *
 * <input type="time"> suit la langue du navigateur, pas celle du site : un
 * Bruxellois dont le systeme est en anglais lit « 02:00 PM » la ou tout le
 * reste de l'ecran dit 14:00. Une liste affiche toujours le meme format.
 */
const HEURES = (() => {
  const out = [];
  for(let h = 0; h < 24; h++)
    for(const m of ['00', '15', '30', '45'])
      out.push(String(h).padStart(2, '0') + ':' + m);
  return out;
})();

function heurePicker(valeur, action, id){
  const v = valeur || '00:00';

  const liste = HEURES.includes(v) ? HEURES : HEURES.concat([v]).sort();
  return '<select class="heure"' + (id ? ' id="' + id + '"' : '')
    + ' onchange="' + action + '">'
    + liste.map(h => '<option value="' + h + '"' + (h === v ? ' selected' : '')

const IDENTITY_STATES = ['none', 'pending', 'verified', 'rejected'];

/*
 * Ce qu'on retient d'une verification d'identite — et rien d'autre.
 * La piece elle-meme n'est jamais conservee : c'est le prestataire qui la

 * Laura par un autre sont, pour le reseau, exactement « identite verifiee ».
 */
function recordVerification(id, prestataire, reference){
  const u = USERS[id];
  if(!u) return;
  u.verif = {provider: prestataire || 'moderation', ref: reference || '—',
             at: "aujourd'hui", method: 'v1'};
}

function setIdentity(id, valeur){
  if(!IDENTITY_STATES.includes(valeur)) return;
  (USERS[id] || {}).identity = valeur;
}
const identityOf = id => (USERS[id] || {}).identity || 'none';
/*
 * Deux notions, un seul examen.
 *
 * « Bike sitter » decrit ce qu'on fait : proposer un emplacement, meme en
 * attente de validation. « Bike sitter verifie » decrit ce que la moderation a
 * regarde : l'emplacement a ete valide, donc la personne a passe un controle en
 * plus de son identite.
 *
 * Il n'y a pas de dossier de candidature : le controle porte sur le lieu, et
 * c'est lui qui accorde le statut. Un cycliste voit ainsi trois niveaux
 * distincts — identite, statut de bike sitter, emplacement — plutot que deux.
 */
const isSitter = id => state.spaces.some(sp =>
  sp.owner === id && ['published', 'review', 'paused'].includes(sp.status));

/** Le statut verifie : au moins un emplacement est passe par la moderation. */
const isVerifiedSitter = id => state.spaces.some(sp =>
  sp.owner === id && ['published', 'paused'].includes(sp.status));
/** Identite verifiee : condition pour demander une garde ou en accueillir une. */
const isVerified = id => identityOf(id) === 'verified';
const isActive = id => (USERS[id]||{}).account === 'active';

/**
 * Presence d'un membre. Le compte connecte est en ligne par definition ;
 * les autres portent une derniere activite en minutes.
 * On n'affiche jamais d'horaire precis : « vu il y a 2 h » suffit et en dit
 * moins sur les habitudes de quelqu'un qu'un horodatage.
 */
function presence(id){
  const min = id === state.role ? 0 : (USERS[id] || {}).seenMin;
  if(min === undefined || min === null) return null;
  if(min < 15)   return {on:true,  label:"En ligne"};
  if(min < 60)   return {on:false, label:"Vu il y a moins d'une heure"};
  if(min < 1440) return {on:false, label:"Vu il y a " + Math.round(min/60) + " h"};
  return {on:false, label:"Vu il y a " + Math.round(min/1440) + " j"};
}
function presenceDot(id, withLabel){
  const p = presence(id);
  if(!p) return '';
  const dot = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;'
    + 'background:' + (p.on ? 'var(--trust)' : 'var(--chalk-strong)') + ';margin-right:5px"></span>';
  return withLabel
    ? '<span class="t-xs" style="color:' + (p.on ? 'var(--trust-deep)' : 'var(--slate)') + '">'
      + dot + esc(p.label) + '</span>'
    : dot;
}
function accessIssues(){
  const me = USERS[state.role];
  if(!me) return [];
  if(me.account === 'pending')
    return ["Votre compte est en cours de validation. Vous pouvez consulter, pas encore demander."];
  if(me.account === 'rejected')
    return ["Votre inscription a été refusée. Renvoyez une pièce lisible depuis vos vérifications."];
  return [];
}

/* ---- Reconnaissance sans classement (docs §5.11) ----------------- */
/**
 * Messages ecrits une seule fois. Un texte recopie a deux endroits finit
 * toujours par diverger : on corrige l'un, on oublie l'autre.
 */
const MSG = {
  notYours:    "Cet emplacement n'est pas le vôtre.",
  notModerator:"Cette action est réservée à la modération.",
  firstReply:  "Bonjour ! C'est noté. Sonnez à la porte latérale en arrivant.",
  checkDiffers:"L'état constaté au retour diffère de celui du dépôt.",
  askReview:   "Garde terminée. Laissez un avis.",
  orderTimes:  "La récupération doit suivre l'arrivée.",
  needRequest: "Créez d'abord une demande depuis un emplacement.",
  badEmail:    "Indiquez une adresse e-mail valide.",
  docDeleted:  "Votre document est supprimé dès la validation, et au plus tard après sept jours. "
             + "Ni l'image ni le numéro ne sont conservés."
};

const MILESTONES = [1, 5, 10, 25, 50];
/**
 * Velos accueillis : les gardes terminees dans l'application, plus
 * l'historique anterieur porte par le membre. Deux sources distinctes, pour
 * qu'on sache toujours d'ou vient le chiffre.
 */
function hostedCount(id){
  return state.requests.filter(r => r.host === id && r.status === 'COMPLETED').length
       + ((USERS[id] && USERS[id].hosted) || 0);
}
/** Dernier jalon franchi, et le suivant à atteindre. */
function milestone(id){
  const n = hostedCount(id);
  const reached = MILESTONES.filter(m => n >= m).pop() || null;
  const next = MILESTONES.find(m => n < m) || null;
  return {count:n, reached, next};
}
/** Chiffre collectif : ce que le réseau a mis à l'abri ce mois-ci. */
function networkCount(){
  return state.requests.filter(r => r.status === 'COMPLETED').length
       + Object.values(USERS).reduce((a,u) => a + u.sessions, 0);
}
/**
 * Membres actifs d'une ville, hors l'auteur de l'evenement.
 * Sert aux deux signaux de quartier : un bike sitter qui ouvre, un velo declare vole.
 */
function neighbours(city, except){
  return Object.values(USERS).filter(p =>
    p.city === city && p.id !== except && p.account === 'active' && p.status !== 'suspended');
}
/** Un membre peut couper chacun des deux signaux. */
function wants(id, key){
  const p = USERS[id];
  return !p || !p.mute || !p.mute.includes(key);
}

/** Emplacements publiés récemment dans la zone du membre. */
function newInArea(){
  const city = (USERS[state.role]||{}).city;
  return state.spaces.filter(sp => sp.status === 'published'
    && sp.owner !== state.role && sp.city === city && sp.views < 50);
}

function errors(list){
  if(!list.length) return '';
  return '<div class="banner alert">' + list.map(esc).join('<br>') + '</div>';
}

/** Avance l'horloge du prototype : expiration et publication des avis. */
/**
 * Heures restantes avant l'arrivee prevue d'une garde.
 * Le prototype part du vendredi 5 septembre a 08:00 et avance avec advanceTime.
 */
function hoursUntil(dateLabel, timeLabel){
  const day = dateIndex(dateLabel);
  if(day < 0) return null;
  const target = day * 24 + minutesOf(timeLabel) / 60;
  const now = minutesOf('08:00') / 60 + state.hoursPassed;
  return target - now;
}
/**
 * Rappels avant l'echeance, des deux cotes.
 * Sur un service gratuit et occasionnel, l'oubli est le premier risque —
 * bien avant la malveillance. Chaque rappel n'est envoye qu'une fois.
 */
function sendReminders(r, hours){
  if(r.status === 'ACCEPTED'){
    const left = hoursUntil(r.date, r.from);
    if(left === null) return;
    if(left <= 24 && left > 2 && !r.rem24){
      r.rem24 = true;
      notify(r.cyclist, "Demain " + fmtDate(r.date) + " à " + r.from
        + " : vous déposez votre vélo chez " + publicName(r.host) + ".",
        {screen:'detail', param:r.id});
      notify(r.host, "Demain " + fmtDate(r.date) + " à " + r.from
        + " : vous accueillez le vélo de " + publicName(r.cyclist) + ".",
        {screen:'detail', param:r.id});
    }
    if(left <= 2 && left > -1 && !r.rem2){
      r.rem2 = true; r.rem24 = true;
      notify(r.cyclist, "Dans deux heures : dépôt chez " + publicName(r.host) + ".",
        {screen:'detail', param:r.id});
      notify(r.host, "Dans deux heures : " + publicName(r.cyclist) + " dépose son vélo chez vous.",
        {screen:'detail', param:r.id});
    }
    return;
  }
  if(r.status === 'ACTIVE'){
    const left = hoursUntil(r.date, r.to);
    if(left !== null && left <= 1 && left > -1 && !r.remBack){
      r.remBack = true;
      notify(r.cyclist, "Récupération prévue à " + r.to + " chez " + publicName(r.host) + ".",
        {screen:'detail', param:r.id});
      notify(r.host, "Le vélo de " + publicName(r.cyclist) + " doit être récupéré à " + r.to + ".",
        {screen:'detail', param:r.id});
    }
  }
}

/** Delai au bout duquel un avis reste seul est publie : sept jours. */
const REVIEW_WAIT_H = 168;

/*
 * Les cinq regles qui manquaient aux avis.
 *
 * 1. Publication : a l'aveugle. Chacun ecrit sans voir celui de l'autre ; les
 *    deux paraissent ensemble, ou seul au bout de sept jours (REVIEW_WAIT_H).
 *
 * 2. Delai pour deposer : quatorze jours apres la cloture. Au-dela, le
 *    souvenir s'estompe et l'avis ne dit plus grand-chose de la garde.
 *
 * 3. Droit de reponse : une seule reponse publique, par la personne visee,
 *    apres publication. Une seule, sinon c'est une dispute en place publique.
 *
 * 4. Contestation : on ne supprime pas un avis parce qu'il deplait. On le
 *    signale, et la moderation tranche.
 *
 * 5. Moderation et suppression : le moderateur peut masquer un avis, avec un
 *    motif journalise. L'auteur, lui, peut retirer le sien tant qu'il n'est pas
 *    publie — apres, il ne le peut plus : un avis retire apres coup fausserait
 *    la reputation de l'autre.
 */
const REVIEW_OPEN_D = 14;

/*
 * Les invitations.
 *
 * Un code affiche en clair, que tout le monde peut recopier, ne vaut rien comme
 * parrainage : le reseau perdrait ce qui fait qu'on s'y sent en confiance.
 *
 * Chaque invitation est donc nominative, a usage unique, et expire au bout de
 * trente jours — passe ce delai, la personne a renonce, et la place doit
 * revenir a quelqu'un d'autre.
 */
const INVIT_EXPIRE_J = 30;
const INVIT_RELANCE_J = 7;

const invitesOf = who => (state.invitations || []).filter(i => i.by === who);
const invitesActives = who => invitesOf(who).filter(i => i.status === 'sent');

/** Ce qu'il reste a envoyer : le quota moins ce qui est encore en vol. */
function invitesLeft(who){
  const u2 = USERS[who] || {};
  return Math.max(0, (u2.invitesQuota !== undefined ? u2.invitesQuota : 3)
    - invitesActives(who).length - invitesOf(who).filter(i => i.status === 'used').length);
}

function sendInvite(email){
  const e = (email || '').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ toast("Adresse e-mail incomplète."); return; }
  if(Object.values(USERS).some(x => (x.email || '').toLowerCase() === e)){
    toast("Cette personne est déjà membre."); return;
  }
  const deja = (state.invitations || []).find(i => i.email === e && i.status === 'sent');
  if(deja){
    // Une invitation en vol : on peut relancer, mais pas tous les jours.
    if((state.hoursPassed - deja.at) < INVIT_RELANCE_J * 24){
      toast("Une invitation est déjà partie à cette adresse. Vous pourrez relancer dans "
        + Math.ceil(INVIT_RELANCE_J - (state.hoursPassed - deja.at) / 24) + " jours.");
      return;
    }
    deja.at = state.hoursPassed; deja.relances = (deja.relances || 0) + 1;
    toast("Invitation renvoyée"); render(); return;
  }
  if(invitesLeft(state.role) <= 0){
    toast("Vous n'avez plus d'invitation. Il en revient une à chaque garde terminée.");
    return;
  }
  state.invitations = state.invitations || [];
  state.invitations.unshift({id:'in'+(state.seq++), by: state.role, email: e,
    code: (u(state.role).name.slice(0,4).toUpperCase() + '-' + (1000 + state.seq)),
    at: state.hoursPassed, status:'sent', relances:0});
  toast("Invitation envoyée à " + e);
  render();
}

/** Une invitation oubliee libere sa place au bout de trente jours. */
function expireInvitations(){
  (state.invitations || []).forEach(i => {
    if(i.status === 'sent' && (state.hoursPassed - i.at) > INVIT_EXPIRE_J * 24){
      i.status = 'expired';
      notify(i.by, "Votre invitation à " + i.email + " a expiré. Elle vous est rendue.",
        {screen:'invitations'});
    }
  });
}

/*
 * Changer l'horaire d'une garde confirmee.
 *
 * Personne ne modifie seul : on propose, l'autre accepte ou refuse. L'ancien
 * horaire reste en vigueur jusqu'a l'accord, et la capacite est revérifiée au
 * moment d'accepter — pas au moment de proposer, sinon une place pourrait etre
 * prise entre-temps.
 *
 * Une prolongation est une modification comme une autre : seule l'heure de fin
 * bouge.
 */
function proposeChange(id, from, to, motif){
  const r = reqById(id);
  if(!r || !isParty(r)){ toast("Cette garde ne vous concerne pas."); return; }
  if(!ENGAGE.includes(r.status)){ toast("Cette garde n'est pas en cours."); return; }
  if(r.change && r.change.status === 'open'){
    toast("Une proposition est déjà en attente de réponse."); return;
  }
  const f = from || r.from, t = to || r.to;
  if(minutesOf(t) - minutesOf(f) < GARDE_MIN_H * 60){
    toast("Une garde dure au moins " + GARDE_MIN_H + " heure."); return;
  }
  if(f === r.from && t === r.to){ toast("Rien n'a changé."); return; }
  r.change = {from: f, to: t, by: state.role, reason: (motif || '').trim(),
    at: clock(), status: 'open'};
  r.events.push({from:r.status, to:r.status, actor: state.role === r.host ? 'host' : 'cyclist',
    at: clock(), note: "A proposé " + f + " → " + t});
  const autre = r.cyclist === state.role ? r.host : r.cyclist;
  notify(autre, publicName(state.role) + " propose de changer l'horaire : " + f + " → " + t
    + ". L'horaire actuel reste valable tant que vous n'avez pas répondu.",
    {screen:'detail', param:r.id}, true);
  toast("Proposition envoyée");
  go('detail', r.id);
}

function decideChange(id, accepte){
  const r = reqById(id);
  if(!r || !r.change || r.change.status !== 'open'){ toast("Aucune proposition."); return; }
  if(r.change.by === state.role){ toast("C'est vous qui l'avez proposée."); return; }
  if(!isParty(r)){ toast("Cette garde ne vous concerne pas."); return; }
  if(accepte){
    // La capacite se verifie ici, pas a la proposition : une place a pu partir.
    const essai = Object.assign({}, r, {from: r.change.from, to: r.change.to});
    if(capacityLeft(spaceOf(r), essai) <= 0){
      toast("La place n'est plus libre sur ce nouvel horaire.");
      r.change.status = 'impossible';
      notify(r.change.by, "Le nouvel horaire n'est plus disponible : l'horaire initial reste "
        + "en vigueur.", {screen:'detail', param:r.id}, true);
      render(); return;
    }
    r.events.push({from:r.status, to:r.status, actor:'system', at:clock(),
      note: "Horaire modifié : " + r.from + " → " + r.to + " devient "
        + r.change.from + " → " + r.change.to});
    r.from = r.change.from; r.to = r.change.to;
    r.change.status = 'accepted';
  } else {
    r.change.status = 'refused';
    r.events.push({from:r.status, to:r.status, actor:'system', at:clock(),
      note:"Changement d'horaire refusé"});
  }
  notify(r.change.by, accepte
    ? "Votre proposition d'horaire a été acceptée : " + r.from + " → " + r.to + "."
    : "Votre proposition d'horaire a été refusée. L'horaire initial reste en vigueur.",
    {screen:'detail', param:r.id}, true);
  toast(accepte ? "Horaire mis à jour" : "Proposition refusée");
  render();
}

/*
 * Un velo, une garde a la fois.
 *
 * On autorise d'envoyer plusieurs demandes pour le meme creneau — c'est meme
 * utile quand on ne sait pas qui repondra. Mais des qu'une est acceptee, les
 * autres n'ont plus d'objet : le velo ne peut pas etre a deux endroits.
 *
 * Elles sont donc annulees automatiquement, le cycliste est averti, et chaque
 * annulation est journalisee — sinon il croirait avoir deux places.
 */
function concurrentes(r){
  return state.requests.filter(x => x.id !== r.id
    && x.bike === r.bike && x.cyclist === r.cyclist
    && x.status === 'PENDING' && overlap(x, r));
}

/** Une garde deja confirmee sur ce velo, au meme moment. */
function dejaConfirmee(cycliste, velo, d, sauf){
  return state.requests.find(x => x.id !== sauf
    && x.cyclist === cycliste && x.bike === velo
    && ENGAGE.includes(x.status) && overlap(x, d));
}

/*
 * Ce qui a ete verifie ne se modifie plus librement.
 *
 * Un prenom qui figure sur une piece d'identite regardee par un humain ne peut
 * pas changer d'un clic : la verification ne vaudrait plus rien, et quelqu'un
 * pourrait se faire passer pour un autre apres coup.
 *
 * Le membre demande la modification, explique pourquoi, et la moderation
 * tranche. Ce qui n'a pas ete verifie — la ville, la photo — reste libre.
 */
const CHAMPS_VERROUILLES = ['name', 'email', 'phone'];
const LIBELLE_CHAMP = {name:"Prénom", email:"Adresse e-mail", phone:"Numéro de téléphone"};

/** Un champ est verrouille des lors que l'identite a ete validee. */
const champVerrouille = (id, champ) =>
  CHAMPS_VERROUILLES.includes(champ) && u(id).verified.includes('Identité');

/** Les demandes de modification en cours pour ce membre. */
const demandesEnCours = id =>
  (state.profileRequests || []).filter(x => x.user === id && x.status === 'open');

function askProfileChange(champ, valeur, motif){
  const v = (valeur || '').trim(), m = (motif || '').trim();
  if(!v){ toast("Indiquez la nouvelle valeur."); return; }
  if(m.length < 10){ toast("Expliquez pourquoi en une phrase au moins."); return; }
  if(demandesEnCours(state.role).some(x => x.field === champ)){
    toast("Une demande est déjà en cours pour ce champ."); return;
  }
  state.profileRequests = state.profileRequests || [];
  state.profileRequests.unshift({id:'mp'+(state.seq++), user: state.role, field: champ,
    from: u(state.role)[champ], to: v, reason: m, at:"aujourd'hui", status:'open'});
  toast("Demande envoyée à la modération");
  go('profile');
}

function decideProfileChange(id, accepte, motif){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const dm = (state.profileRequests || []).find(x => x.id === id);
  if(!dm || dm.status !== 'open'){ toast("Demande introuvable."); return; }
  dm.status = accepte ? 'accepted' : 'refused';
  dm.decidedReason = motif || '';
  if(accepte){
    USERS[dm.user][dm.field] = dm.to;
    // Changer un element verifie annule la verification : il faut la refaire.
    if(dm.field === 'name')
      USERS[dm.user].verified = USERS[dm.user].verified.filter(x => x !== 'Identité');
  }
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(),
    action: accepte ? "Modification de profil acceptée" : "Modification de profil refusée",
    target: dm.user, reason: dm.reason, at:"aujourd'hui"});
  notify(dm.user, accepte
    ? "Votre demande de modification a été acceptée."
    : "Votre demande de modification a été refusée.", {screen:'profile'}, true);
  toast(accepte ? "Modification appliquée" : "Demande refusée");
  render();
}

/** Peut-on encore deposer un avis sur cette garde ? */
function reviewWindowOpen(r){
  if(!r || r.status !== 'COMPLETED') return false;
  return (r.ageH || 0) <= REVIEW_OPEN_D * 24;
}

/** Une seule reponse, par la personne visee, apres publication. */
function canReplyToReview(v){
  return !!v && v.status === 'published' && v.target === state.role && !v.reply;
}

function openReply(id){ go('reply', id); }
function openDispute(id){ go('disputereview', id); }

function replyToReview(id, texte){
  const v = state.reviews.find(x => x.id === id);
  if(!canReplyToReview(v)){ toast("Cette réponse n'est pas possible."); return; }
  const t = (texte || '').trim();
  if(t.length < 10){ toast("Écrivez au moins une phrase."); return; }
  v.reply = { text: t, by: state.role, at: clock() };
  notify(v.author, "Votre avis a reçu une réponse.",
    {screen:'pubprofile', param: v.target});
  toast("Réponse publiée");
  render();
}

/** Contester un avis : on saisit la moderation, on ne l'efface pas. */
function disputeReview(id, motif){
  const v = state.reviews.find(x => x.id === id);
  if(!v || v.target !== state.role){ toast("Vous ne pouvez pas contester cet avis."); return; }
  if(v.disputed){ toast("Cet avis est déjà signalé."); return; }
  v.disputed = true;
  state.reports.unshift({id:'p'+(state.seq++), by: state.role, target: v.id,
    kind:'review', reason:"Avis contesté", details: motif || "Motif non précisé",
    at:"aujourd'hui", status:'open'});
  toast("Signalé à la modération");
  render();
}

/** La moderation masque un avis : il disparait des moyennes, pas de l'histoire. */
function hideReview(id, motif){
  if(!isModerator()){ toast(MSG.notModerator); return; }
  const v = state.reviews.find(x => x.id === id);
  if(!v){ toast("Avis introuvable."); return; }
  v.status = 'hidden';
  v.hiddenReason = motif || "Motif non précisé";
  state.journal.unshift({id:'j'+(state.seq++), admin: moderatorName(), action:"Avis masqué",
    target: v.id, reason: v.hiddenReason, at:"aujourd'hui"});
  notify(v.author, "Un de vos avis a été masqué par la modération.", null);
  notify(v.target, "Un avis vous concernant a été masqué.", null);
  toast("Avis masqué");
  render();
}

/** L'auteur retire son avis tant qu'il n'est pas publie. */
function withdrawReview(id){
  const v = state.reviews.find(x => x.id === id);
  if(!v || v.author !== state.role){ toast("Ce n'est pas votre avis."); return; }
  if(v.status !== 'pending'){
    toast("Un avis publié ne peut plus être retiré. Vous pouvez le contester.");
    return;
  }
  state.reviews = state.reviews.filter(x => x.id !== id);
  toast("Avis retiré");
  render();
}

function expireVouchers(hours){
  state.vouchers.forEach(v => {
    if(v.status !== 'active') return;
    v.daysLeft -= hours / 24;
    if(v.daysLeft > 0) return;
    v.status = 'expired';
    const w = rewardById(v.reward);
    if(w) w.stock += 1;          // la recompense redevient disponible
    notify(v.member, "Votre bon a expiré : vos " + v.cost
      + " maillons vous sont rendus.", {screen:'vouchers'});
  });
}

function advanceTime(hours){
  state.hoursPassed += hours;
  expireVouchers(hours);
  state.requests.forEach(r => sendReminders(r, hours));
  state.requests.forEach(r => {
    if(r.status === 'PENDING'){
      r.ageH = (r.ageH||0) + hours;
      if(r.ageH >= 24){
        apply(r, 'EXPIRED', 'système');
        notify(r.cyclist, "Votre demande a expiré : le bike sitter n'a pas répondu sous 24 heures.");
        notify(r.host, "Une demande a expiré faute de réponse.");
        pauseIfSilent(r.host);
      }
      return;
    }
    // Relance quand l'hote ne confirme pas la reception
    if(r.status === 'ARRIVAL'){
      r.waitH = (r.waitH||0) + hours;
      if(r.waitH >= 2 && !r.relanced){
        r.relanced = true;
        notify(r.host, "Le cycliste est arrivé. Confirmez la réception du vélo.");
      }
      if(r.waitH >= 24 && r.status !== 'DISPUTED'){
        apply(r, 'DISPUTED', 'système');
        r.reason = "Réception jamais confirmée après 24 heures.";
        state.reports.unshift({id:'p'+(state.seq++), by:'système', targetType:'session', target:r.id,
          reason:"Réception non confirmée", details:r.reason, status:'open', date:"aujourd'hui"});
        notify(r.cyclist, "Anomalie signalée : votre bike sitter n'a pas confirmé la réception.");
        notify(r.host, "Anomalie signalée sur une garde.");
      }
      return;
    }
    // Depassement de l'heure de recuperation prevue
    if(r.status === 'ACTIVE' || r.status === 'RETURN_REQUESTED'){
      r.heldH = (r.heldH||0) + hours;
      if(r.heldH >= 24 && !r.overdue){
        r.overdue = true;
        notify(r.cyclist, "L'heure de récupération est dépassée. Prévenez votre bike sitter.");
        notify(r.host, "Le vélo n'a pas été récupéré à l'heure prévue.");
      }
      if(r.heldH >= 48 && r.status !== 'DISPUTED'){
        apply(r, 'DISPUTED', 'système');
        r.reason = "Vélo non récupéré 48 heures après l'heure prévue.";
        state.reports.unshift({id:'p'+(state.seq++), by:'système', targetType:'session', target:r.id,
          reason:"Vélo non récupéré", details:r.reason, status:'open', date:"aujourd'hui"});
        notify(r.cyclist, "Litige ouvert automatiquement sur votre garde.");
        notify(r.host, "Litige ouvert automatiquement sur une garde.");
      }
    }
  });
  state.thefts.forEach(t => { t.ageH = (t.ageH||0) + hours; });
  expireInvitations();
  // Un avis attend celui de l'autre, mais pas indefiniment : au bout de sept
  // jours il est publie seul, sinon le travail de celui qui a repondu est perdu.
  // Le cahier des charges dit sept jours ; le code en comptait quatorze.
  state.reviews.forEach(v => {
    if(v.status !== 'pending') return;
    v.ageH = (v.ageH||0) + hours;
    if(v.ageH >= REVIEW_WAIT_H){
      v.status = 'published';
      notify(v.target, "Un avis vous concernant vient d'être publié.",
        {screen:'pubprofile', param:v.target});
    }
  });
  toast(hours >= 24 ? "+ 1 jour · " + Math.round(state.hoursPassed/24) + " j écoulés"
                    : "+ 1 h · " + state.hoursPassed + " h écoulées");
  render();
}
const publishedReviews = target => state.reviews.filter(v => v.target === target && v.status === 'published');

function jump(target, role){
  if(role && role!==state.role) setRole(role);
  const [name, a, b] = target.split(':');
  if(name==='admin'){ state.adminPage = a; state.screen='admin'; state.back=[]; render(); return; }
  let param = a;
  if(a === 'first'){
    const r = myRequests()[0];
    if(!r){ toast(MSG.needRequest); return; }
    param = r.id;
  }
  if(name==='report') param = a+':'+b;
  if(a === 'active'){
    // Remise et constat n'existent que sur une garde en cours.
    const r = state.requests.find(x =>
      (x.cyclist===state.role || x.host===state.role)
      && ['ACCEPTED','ARRIVAL','BIKE_RECEIVED','ACTIVE','RETURN_REQUESTED'].includes(x.status));
    if(!r){ toast("Aucune garde en cours : acceptez une demande d'abord."); return; }
    param = r.id + ':' + (b || 'depot');
    if(name === 'check') state.checkDraft = {state:'', note:'', photos:0};
    if(name === 'handover'){ state.codeDraft = ''; handoverCode(r, b || 'depot'); }
  }
  if(a === 'firstconvo'){
    const c = myConvos()[0];
    if(!c){ toast("Aucune conversation : faites accepter une demande d'abord."); return; }
    param = c.id;
  }
  if(name==='motive'){
    const r = myRequests()[0];
    if(!r){ toast(MSG.needRequest); return; }
    param = r.id + ':decline';
  }
  if(TABSCREEN[name]) { tab(name); return; }
  state.back=[{s:'index',p:null}]; state.screen=name; state.param=param||null; scrollTop(); render();
}

  const from = (document.getElementById('ce')||{}).value || 'visiteur@exemple.be';
  if(!body.trim()){ toast("Écrivez votre message."); return; }
  state.contacts.unshift({id:'c'+(state.seq++), from, subject:(document.getElementById('cs')||{}).value || "Question générale",
    body:body.trim(), at:"aujourd'hui", status:'open'});
  toast("Message envoyé. Réponse sous 48 heures.");
  render();
}

function signupIssues(){
  const d = state.signup.data, out = [];
  if(state.signup.step !== 1) return out;
  if(!(d.first||'').trim()) out.push("Indiquez votre prénom.");
  if(!(d.email||'').includes('@')) out.push(MSG.badEmail);
  if((d.pwd||'').length < 8) out.push("Le mot de passe doit faire au moins 8 caractères.");
  // Deux comptes sur la meme adresse rendraient la verification d'identite
  // contournable : on s'inscrirait deux fois pour repartir a zero.
  const mail = (d.email||'').trim().toLowerCase();
  if(mail && Object.values(USERS).some(p => (p.email||'').toLowerCase() === mail))
    out.push("Cette adresse est déjà utilisée. Connectez-vous, ou demandez un nouveau mot de passe.");
  return out;
}
function setCode(i, v){
  const cur = (state.signup.data.code||'    ').padEnd(4,' ').split('');
  // Le code arrive par SMS et ne contient que des chiffres : accepter une
  // lettre ne pouvait mener qu'a un refus incomprehensible a la validation.
  const car = (v||' ').slice(-1);
  cur[i] = /[0-9]/.test(car) ? car : ' ';
  state.signup.data.code = cur.join('').replace(/\s+$/,'');
  render();
}
function codeIssues(){
  const c = (state.signup.data.code||'').trim();
  if(c.length < 4) return [];
  return c === '4729' ? [] : ["Code incorrect."];
}
function signupStep(n){
  const next = Math.min(3, Math.max(1, state.signup.step+n));
  if(next === 3 && state.signup.step === 2){
    const c = (state.signup.data.code||'').trim();
    if(c !== '4729'){ toast("Entrez le code reçu par SMS (4729 dans le prototype)."); return; }
  }
  state.signup.step = next; scrollTop(); render();
}
function finishSignup(later){
  const d = state.signup.data;
  if(d.first){
    USERS.lucas.name = d.first.trim();
    USERS.lucas.initial = d.first.trim()[0].toUpperCase();
  }
  if(d.email) USERS.lucas.email = d.email.trim();
  USERS.lucas.verified = USERS.lucas.verified.filter(v=>v!=='Identité');
  USERS.lucas.account = 'pending';
  USERS.lucas.sponsor = d.sponsor || USERS.lucas.sponsor;
  state.identityQueue.unshift({id:'q'+(state.seq++), user:'lucas', submitted:"aujourd'hui",
    status:'pending', sponsor:d.sponsor||null});
  state.signup.step = 1; state.signup.data = {};
  toast("Compte créé. Un administrateur valide votre pièce sous 24 heures.");
  setRole('lucas');
}

function loginIssues(){
  const out = [];
  if(!(state.loginEmail||'').includes('@')) out.push("Entrez une adresse e-mail valide.");
  if((state.loginPwd||'').length < 8) out.push("Le mot de passe fait au moins 8 caractères.");
  return out;
}
function doLogin(){
  const email = (state.loginEmail||'').trim().toLowerCase();
  const found = Object.values(USERS).find(x => (x.email||'').toLowerCase() === email);
  if(!found){ toast("Aucun compte avec cette adresse."); return; }
  if(found.status === 'suspended'){ toast("Ce compte est suspendu."); return; }
  state.loginEmail = ''; state.loginPwd = '';
  toast("Bienvenue " + found.name);
  setRole(found.id === 'thomas' ? 'thomas' : 'lucas');
}

function submitIdentity(){
  const me = state.role;
  if(USERS[me].verified.includes('Identité')){ toast("Votre identité est déjà vérifiée."); back(); return; }
  // La date de naissance figure sur la piece que le moderateur regarde deja :
  // il n'y a rien de plus a controler, seulement a le declarer avant.
  if(!state.majorDeclare){
    toast("Confirmez d'abord que vous êtes majeur.");
    return;
  }
  if(state.identityQueue.some(q=>q.user===me && q.status==='pending')){ toast("Vérification déjà en cours."); back(); return; }
  state.identityQueue.unshift({id:'q'+(state.seq++), user:me, submitted:"aujourd'hui", status:'pending'});
  notify(me, "Votre pièce a bien été reçue. Réponse sous 24 heures.");
  toast("Envoyé. Un administrateur vérifie sous 24 h."); back();
}

    + (n?'<span class="dot" style="top:0;right:0;margin:0"></span>':'')+'</button>'
    + '<div class="avatar" onclick="tab(\'profile\')" style="cursor:pointer">'+me.initial+'</div></div>';

/**
 * Calendrier de septembre 2026. Seules les journees ouvertes a la reservation
 * sont cliquables : le reste est visible mais inerte, pour que la personne
 * comprenne pourquoi elle ne peut pas les choisir.
 */
S.calendar = () => {
  const target = state.calTarget || 'search.date';
  const current = target.split('.').reduce((o,k)=>o[k], state);
  const min = target.endsWith('dateTo')
    ? dateIndex(target.startsWith('search') ? state.search.date : state.draft.date)
    : 0;
  let h = topbar("Choisir une date", true)
    + '<div class="pad">'
    + '<p class="t-s muted" style="margin-bottom:12px">'
    + (target.endsWith('dateTo') ? "Jour de la récupération" : "Jour du dépôt") + ' · septembre 2026</p>';
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';
  ['L','M','M','J','V','S','D'].forEach(d=>{
    h += '<div class="t-xs muted" style="padding:4px 0">'+d+'</div>';
  });
  // Le 1er septembre est un lundi : aucune case vide en tete de grille.
  for(let day = 1; day <= 30; day++){
    const label = labelOfDay(day);
    const idx = label ? dateIndex(label) : -1;
    const open = label !== null && idx >= min && idx < HORIZON_J;
    const on = label === current;
    h += '<div style="padding:9px 0;border-radius:8px;font-size:14px;'
      + (on ? 'background:var(--trust);color:#fff;'
            : open ? 'background:var(--raised);border:1px solid var(--chalk);cursor:pointer;'
                   : 'color:var(--chalk-strong);')
      + '"' + (open && !on ? ' onclick="pickDate(\''+label+'\')"' : '')
      + '>' + day + '</div>';
  }
  h += '</div>';
  h += '<p class="t-xs muted" style="margin-top:14px;line-height:1.6">'
    + (target.endsWith('dateTo')
        ? "Les jours antérieurs au dépôt ne sont pas proposés."
        : "Les demandes de garde sont ouvertes sur " + HORIZON_J + " jours.")
    + '</p></div>';
  return h;
};
function openCal(target){
  state.calTarget = target;
  go('calendar');
}
function pickDate(label){
  const [obj, key] = (state.calTarget || 'search.date').split('.');
  state[obj][key] = label;
  // La recuperation ne peut pas preceder le depot.
  if(key === 'date'){
    const to = state[obj].dateTo;
    if(!to || dateIndex(to) < dateIndex(label)) state[obj].dateTo = label;
  }
  back();
}

/**
 * Un nouveau bike sitter ouvre : tout le quartier est prevenu.
 * C'est le signal qui fait vivre un quartier pendant la phase de demarrage,
 * quand la densite est le seul obstacle.
 */
function announceNewSitter(sp){
  const first = state.spaces.filter(x => x.owner === sp.owner).length === 1;
  let sent = 0;
  neighbours(sp.city, sp.owner).forEach(p => {
    if(!wants(p.id, 'sitter')) return;
    notify(p.id, (first ? publicName(sp.owner) + " devient bike sitter à " + sp.city
                        : publicName(sp.owner) + " ouvre un nouvel emplacement à " + sp.city)
      + " · " + sp.type + ".", {screen:'space', param:sp.id});
    sent++;
  });
  return sent;
}

/** Une alerte tient sa promesse : publier un emplacement prévient ceux qui attendaient. */
function triggerAlerts(sp){
  let sent = 0;
  state.alerts.forEach(a => {
    if(a.user === sp.owner) return;
    if(a.cities && !a.cities.includes(sp.city)) return;
    if(a.date && !withinHours(sp, a.date, a.from, a.to)) return;
    notify(a.user, "Un nouvel emplacement vient d'ouvrir près de " + a.q + " : " + sp.type + ".",
      {screen:'space', param:sp.id});
    sent++;
  });
  if(sent) toast(sent + " personne" + (sent>1?"s":"") + " en attente ont été prévenues.");
  return sent;
}

/** En-tete d'un lieu relais : le lieu passe avant la personne. */
/**
 * Caracteristiques d'un emplacement, telles que le cycliste les lit.
 * Chaque ligne correspond a une question du parcours d'ajout : si une reponse
 * n'apparait nulle part, la question n'aurait pas du etre posee.
 */
/** Trois signaux, en une ligne, pour choisir sans ouvrir la fiche. */
function resultFacts(s){
  const bits = [];
  if(s.weather === 'interieur') bits.push('à l\'intérieur');
  else if(s.weather === 'abri')  bits.push('sous abri');
  if(s.lock && s.lock !== 'aucun') bits.push('fermé à clé');
  if(s.anchor) bits.push('point d\'ancrage');
  if(s.hardAccess) bits.push('accès contraint');
  return bits.join(' · ');
}

function spaceFacts(s){
  const rows = [];
  if(s.spot && !isRelay(s)) rows.push(['&#127968;', s.spot]);
  if(s.lock) rows.push(['&#128274;', LOCK_KINDS[s.lock] || s.lock]);
  if(s.weather) rows.push(['&#9925;', WEATHER_KINDS[s.weather] || s.weather]);
  if(s.anchor)
    rows.push(['&#128279;', (s.anchorKind || "Point d'ancrage")
      + (s.anchorEach ? ' · chaque vélo peut être attaché' : '')]);
  if((s.securityExtra||[]).length) rows.push(['&#128247;', s.securityExtra.join(', ')]);
  if(s.access) rows.push(['&#128682;', 'Accès : ' + s.access.toLowerCase()]);
  if(s.hardAccess && s.accessNote) rows.push(['&#9888;', s.accessNote]);

/** Ecran ouvert sans son objet : on l'explique au lieu de planter. */
/**
 * Qui a le droit de voir cette garde.
 * Les deux parties, et personne d'autre — le moderateur passe par le back-office,
 * qui journalise ses consultations.
 */
const isParty = r => r && (r.cyclist === state.role || r.host === state.role);
/*
 * Un emplacement peut etre tenu par plusieurs personnes.
 *
 * Une colocation, une famille, deux associes d'un commerce : celui qui a
 * publie reste le proprietaire du dossier, mais les co-gerants ouvrent la
 * porte, acceptent les demandes et rendent les velos. Sans cela, un
 * emplacement s'arrete des que la seule personne inscrite part en week-end.
 *
 * La distinction compte : le proprietaire seul peut supprimer l'emplacement,
 * changer d'adresse ou modifier l'equipe. Le reste se partage.
 */
const isOwner = sp => sp && sp.owner === state.role;
const managersOf = sp => sp ? [sp.owner].concat(sp.managers || []) : [];
/** Peut tenir l'emplacement au quotidien : le proprietaire ou un co-gerant. */
const canManage = sp => sp && managersOf(sp).includes(state.role);
/** Un co-gerant doit remplir les memes conditions que celui qui a publie. */
const MAX_MANAGERS = 4;
/** Le back-office est reserve au moderateur. */
/*
 * La moderation n'est pas une personne, c'est un role.
 *
 * Avec un seul moderateur, une semaine de conge arrete les validations
 * d'identite — et plus personne n'entre. Deux suffisent pour une beta : l'un
 * couvre l'autre.
 *
 * Chaque decision garde le nom de qui l'a prise : c'est ce qui permet de
 * revenir dessus, et de repartir la charge sans se marcher dessus.
 */
const MODERATEURS = ['admin', 'admin2'];
const isModerator = () => MODERATEURS.includes(state.role);

/** Moyenne par critere, calculee sur les avis publies. */
function criteriaAverages(target, sens){
  // Sans sens precis, on melangerait « accueil » et « ponctualite » dans le
  // meme tableau : deux metiers differents, deux grilles differentes.
  const revs = publishedReviews(target)
    .filter(v => v.criteria && (!sens || v.dir === sens));
  const acc = {};
  revs.forEach(v=>Object.entries(v.criteria).forEach(([k,val])=>{
    acc[k] = acc[k] || {sum:0,n:0}; acc[k].sum += val; acc[k].n++;
  }));
  return Object.entries(acc).map(([k,x])=>[k, x.sum/x.n]);
}

/*
 * Le reseau n'est pas un annuaire.
 *
 * Un membre voit le profil d'un bike sitter parce qu'il envisage de lui confier
 * son velo : c'est le sens de la fiche publique. Il n'a aucune raison de
 * parcourir les profils des autres cyclistes.
 *
 * Un bike sitter, lui, voit le profil des membres qui l'ont contacte — et
 * seulement ceux-la. Sans quoi publier un emplacement deviendrait un moyen
 * d'acceder a la liste des habitants du quartier.
 */
function canSeeProfile(id){
  if(id === state.role) return true;
  if(isModerator()) return true;
  // Un bike sitter est visible : c'est ce qui permet de choisir a qui confier.
  if(state.spaces.some(sp => sp.owner === id && sp.status === 'published')) return true;
  // Sinon, il faut une garde en commun, dans un sens ou dans l'autre.
  return state.requests.some(r =>
    (r.cyclist === id && r.host === state.role) ||
    (r.host === id && r.cyclist === state.role));
}

  if(!USERS[state.param]) return missingScreen("Ce profil");
  if(!canSeeProfile(state.param)) return refusedScreen('profil');
  const p = u(state.param);

   * Si elle accueille, on consulte sa fiche de bike sitter. Sinon, son profil

   */
  const commeSitter = isSitter(p.id) && p.id !== state.role;
  const revs = commeSitter ? reviewsAsHost(p.id) : reviewsAsCyclist(p.id);
  const avg = averageOf(revs);
  let h = topbar(p.name, true) + '<div class="pad">';
  if(traceCount(p.id))

  h += '<div class="row" style="margin-bottom:12px"><div class="avatar lg">'+p.initial+'</div>'
    + '<div class="grow"><p class="strong" style="font-size:16px">'+p.name+'</p>'
    // « Nouveau membre » ne se dit que de quelqu'un qui n'a rien fait : dire
    // cela de quelqu'un qui a mene trente gardes etait absurde.
    + '<p class="t-xs muted">'
      + (revs.length >= 3
          ? '★ ' + avg.toFixed(1) + ' · ' + revs.length + ' avis'
          : (p.sessions >= 5
              ? "Pas encore assez d'avis pour une note"
              : 'Nouveau membre'))
      // Sur une fiche de bike sitter, on compte ce qu'il a accueilli. Le nombre
      // de ses propres depots appartient a son profil de membre.
      + ' · ' + (commeSitter
          ? hostedCount(p.id) + ' vélos accueillis'
          : p.sessions + ' gardes') + '</p>'
    + '<p class="t-xs muted">Membre depuis '+p.since+'</p></div></div>';
  h += '<div style="margin-bottom:8px">'+presenceDot(p.id, true)+'</div>';
  h += badges(p) + impactBlock(p.id);
  const avgs = criteriaAverages(p.id, commeSitter ? 'cyclist_to_host' : 'host_to_cyclist');
  if(avgs.length){
    h += '<div class="card" style="margin-top:12px"><div class="card-body">'
      + '<p class="t-xs muted" style="margin-bottom:8px">Détail des notes</p>'
      + avgs.map(([k,val])=>'<div class="row" style="justify-content:space-between;margin-bottom:4px">'
          + '<span class="t-s muted">'+esc(k)+'</span><span class="t-s">★ '+val.toFixed(1)+'</span></div>').join('')
      + '</div></div>';
  }
  const sp = state.spaces.filter(s=>s.owner===p.id && s.status==='published');
  if(sp.length){
    h += '<p class="section-h" style="padding-left:0">Emplacements proposés</p>';
    sp.forEach(s=>{ h += spaceRow(s); });
  }
  h += '<p class="section-h" style="padding-left:0">Avis reçus</p>';
  if(!revs.length) h += '<p class="t-s muted">Nouveau membre — pas encore d\'avis.</p>';
  revs.forEach(v=>{ h += reviewCard(v); });
  if(p.id!==state.role){
    h += '<div class="btnrow" style="margin-top:12px">'
      + '<button class="btn ghost" style="flex:1" onclick="go(\'report\',\'user:'+p.id+'\')">Signaler</button>'
      + '<button class="btn danger" style="flex:1" onclick="blockUser(\''+p.id+'\')">Bloquer</button></div>';
  }
  return h + '</div>';
};
/**
 * Echanger des maillons contre une recompense.
 * Le stock descend a l'echange, jamais en boutique : sinon deux personnes
 * prennent le dernier antivol le meme jour et l'une des deux se deplace pour
 * rien.
 */
function redeem(id){
  const w = rewardById(id);
  if(!w || !w.active){ toast("Cette offre n'est plus disponible."); return; }
  if(!canRedeem()){
    toast("Le catalogue remercie les personnes qui accueillent des vélos.");
    return;
  }
  if(w.stock <= 0){ toast("Cette offre est épuisée pour le moment."); return; }
  if(linkBalance(state.role) < w.cost){
    toast("Il vous faut " + w.cost + " maillons pour cette offre.");
    return;
  }
  const echanger = () => {
    w.stock -= 1;
    // Meme principe que les codes de remise : deterministe, donc testable.
    const graine = (id + state.role + state.seq).split('')
      .reduce((a, c) => a + c.charCodeAt(0), 0);
    const code = String(1000 + (graine * 7919) % 9000);
    state.vouchers.unshift({id:'v'+(state.seq++), member:state.role, reward:w.id,
      code, cost:w.cost, at:clock(), daysLeft:VOUCHER_DAYS, status:'active'});
    notify(state.role, "Votre bon pour « " + w.title + " » est prêt. "
      + "Présentez le code chez " + w.partner + ".", {screen:'vouchers'});
    toast("Bon créé — à présenter chez " + w.partner);
    go('vouchers');
  };
  if(!act("Échange de maillons", echanger)) return;
  render();
}

function sendRequest(){

    toast("Votre compte doit être validé avant de demander une garde.");

  const s = spaceById(state.draft.spaceId) || GONE_SPACE;

  if(issues.length){ toast(issues[0]); return; }
  const r = {id:'r'+(state.seq++), spaceId:s.id, cyclist:state.role, host:s.owner, bike:state.draft.bike,
    date:state.draft.date, dateTo:state.draft.dateTo||state.draft.date,
    from:state.draft.from, to:state.draft.to, msg:state.draft.msg,
    repeat:state.draft.repeat||'none',
    status:'PENDING', ageH:0, events:[{from:null,to:'PENDING',actor:'cyclist',at:clock()}]};
  // Comme les transitions, l'envoi passe par le reseau simule : sans cela, une
  // demande semblait partie hors ligne alors qu'elle n'atteignait personne.
  const envoyer = () => {
    state.requests.unshift(r);
    if(state.draft.msg) state.messages[r.id] = [{from:state.role, text:state.draft.msg, at:clock()}];

      {screen:'detail', param:r.id});

    toast("Demande envoyée à "+publicName(s.owner)); scrollTop();
  };
  if(!act("Demande de garde", envoyer)) return;
  render();
}

};

function openHandover(id, phase){
  state.codeDraft = '';
  handoverCode(reqById(id), phase);
  go('handover', id + ':' + phase);
}
function confirmHandover(id, phase){
  const r = reqById(id);
  const typed = state.codeDraft || '';
  const issues = handoverIssues(r, phase, typed);
  if(issues.length){
    // Seule une saisie complete et fausse consomme un essai.
    if(/^\d{4}$/.test(typed) && !countTry(r, phase, typed)){ state.codeDraft = ''; render(); }
    else toast(issues[0]);
    return;
  }
  // Le journal retient les deux noms : le code appartient a l'un, la saisie a l'autre.
  r.handover = r.handover || {};
  r.handover[phase] = {by: state.role, from: CODE_HOLDER[phase], at: clock()};
  state.codeDraft = '';
  back();
  // L'echange est complet : la transition s'execute au nom de l'acteur qui en a
  // le droit, que la derniere saisie vienne du cycliste ou du bike sitter.
  const event = phase === 'depot' ? 'receive' : 'return';
  transition(r, event);
}

/**
 * A l'acceptation d'une demande recurrente, les occurrences suivantes sont
 * creees deja acceptees. Chacune garde son propre deroule ; la capacite et
 * les disponibilites sont verifiees occurrence par occurrence.
 */
function spawnSeries(parent){
  const sp = spaceById(parent.spaceId);
  const start = dateIndex(parent.date);
  if(start < 0) return 0;
  const wd = DATES[start].wd;
  let made = 0, skipped = 0;
  for(let i = start + 1; i < DATES.length && made < 5; i++){
    const d = DATES[i];
    const fits = parent.repeat === 'weekdays' ? (d.wd >= 1 && d.wd <= 5) : (d.wd === wd);
    if(!fits) continue;
    if(!withinHours(sp, d.label, parent.from, parent.to)){ skipped++; continue; }
    const probe = {id:null, spaceId:sp.id, date:d.label, from:parent.from, to:parent.to};
    if(capacityLeft(sp, probe) <= 0){ skipped++; continue; }
    state.requests.push({
      id:'r'+(state.seq++), spaceId:sp.id, cyclist:parent.cyclist, host:parent.host,
      bike:parent.bike, date:d.label, from:parent.from, to:parent.to, msg:'',
      repeat:'none', seriesOf:parent.id, status:'ACCEPTED', ageH:0,
      events:[{from:null, to:'ACCEPTED', actor:'système', at:clock()}]
    });
    made++;
  }
  parent.seriesCount = made;
  parent.seriesSkipped = skipped;
  if(made) notify(parent.cyclist, made+" gardes récurrentes ont été confirmés.");
  if(skipped) notify(parent.cyclist, skipped+" date(s) de la série n'ont pas pu être réservées.");
  return made;
}
function seriesMembers(id){ return state.requests.filter(r => r.seriesOf === id); }
function stopSeries(id){
  const r = reqById(id);

  if(future.length && !state.seriesConfirmed){
    confirmAction("Interrompre la série",
      future.length+" garde(s) à venir seront annulées. Celui en cours se termine normalement.",
      "Interrompre",
      () => { state.seriesConfirmed = true; stopSeries(id); state.seriesConfirmed = false; });
    return;
  }
  state.seriesConfirmed = false;
  future.forEach(x => { apply(x, 'CANCELLED', 'système'); x.reason = "Série interrompue."; });

  notify(r.cyclist===state.role ? r.host : r.cyclist,

  render();
}
/**
 * Un desistement tardif n'est pas une annulation ordinaire.
 * Quand le bike sitter se retire moins de LATE_H heures avant l'arrivee, le
 * membre se retrouve avec un velo et sans solution. Le produit doit alors
 * faire trois choses : le prevenir tout de suite, lui proposer autre chose sur
 * le meme creneau, et garder la trace — un desistement repete est le seul
 * comportement qui vide un reseau d'entraide en silence.
 */
/*
 * Deux heures, et non douze.
 *
 * Le seuil de douze heures venait d'un modele ou l'on gardait plusieurs jours.
 * Une garde de trois heures decidee le matin ne peut pas s'annuler douze heures
 * a l'avance : la regle etait mecaniquement inapplicable, et elle classait en
 * « desistement tardif » des annulations parfaitement normales.
 */
const LATE_H = 2;

/*
 * Le retard au depot.
 *
 * Le cycliste a rendez-vous a 14 h et arrive a 15 h 30. Le bike sitter a
 * attendu, ou il est sorti. Rien ne le signalait jusqu'ici — ni au premier, ni
 * au second.
 *
 * Trente minutes de tolerance : en dessous, c'est la vie courante.
 */
const RETARD_DEPOT_MIN = 30;

/*
 * Quand personne n'ouvre.
 *
 * Le cycliste a signale son arrivee et attend. Au bout de dix minutes on lui
 * rappelle qu'il a le numero — devant une porte, sous la pluie, on n'y pense
 * pas. Au bout de vingt, il peut clore la garde lui-meme.
 *
 * Dix minutes, c'est le temps de descendre trois etages : plus court
 * produirait des abandons alors que la personne arrivait.
 *
 * On n'ouvre pas de litige pour autant, et rien ne s'inscrit sur le profil du
 * bike sitter : il est peut-etre aux toilettes. C'est a la moderation de
 * decider, si le cas se repete.
 */
const ATTENTE_APPEL_MIN = 10;
const ATTENTE_SORTIE_MIN = 20;

/** Depuis combien de minutes le cycliste attend devant la porte. */
function waitingAtDoor(r){
  if(!r || r.status !== 'ARRIVAL' || r.arrivedH === undefined) return 0;
  return Math.max(0, Math.round((state.hoursPassed - r.arrivedH) * 60));
}

/** De combien de minutes l'arrivee est-elle depassee. */
function lateAtDrop(r){
  if(!['ACCEPTED','ARRIVAL'].includes(r.status)) return 0;
  const prevu = minutesOf(r.from || '00:00');
  const maintenant = minutesOf('08:00') + state.hoursPassed * 60;
  return Math.max(0, Math.round(maintenant - prevu));
}
const isLateAtDrop = r => lateAtDrop(r) >= RETARD_DEPOT_MIN;

/** Prevenir qu'on arrive en retard : un geste, pas un formulaire. */
function annoncerRetard(id){
  const r = reqById(id);
  if(!r || r.cyclist !== state.role){ toast("Seul le cycliste peut prévenir."); return; }
  if(r.lateNotice){ toast("Le bike sitter est déjà prévenu."); return; }
  r.lateNotice = { at: clock() };
  r.events.push({from:r.status, to:r.status, actor:'cyclist', at:clock(),
    note:"A prévenu de son retard"});
  notify(r.host, publicName(r.cyclist) + " vous prévient qu'il arrive en retard.",
    {screen:'detail', param:r.id}, true);
  toast("Le bike sitter est prévenu");
  render();
}
function isLateCancel(r){
  const h = hoursUntil(r.date, r.from);
  return h !== null && h < LATE_H;
}
/** Ce qui reste de libre sur le meme creneau, ailleurs. */
function alternativesFor(r){
  return state.spaces.filter(sp =>
    sp.id !== r.spaceId && isBookable(sp) && sp.owner !== r.cyclist
    && USERS[sp.owner].status !== 'suspended'
    && withinHours(sp, r.date, r.from, r.to, r.dateTo)
    && capacityLeft(sp, {id:null, spaceId:sp.id, date:r.date, dateTo:r.dateTo,
        from:r.from, to:r.to}) > 0);
}

function actBtn(r,a){ return '<button class="btn '+a.style+'" onclick="'+actCall(r,a)+'">'+actionLabel(a)+'</button>'; }
/** Refus et annulation exigent un motif : on passe par un ecran dedie. */
function actCall(r,a){
  return (a.event==='decline'||a.event==='cancel'||a.event==='dispute'||a.event==='noshow'
          ||a.event==='noanswer')
    ? "go('motive','"+r.id+":"+a.event+"')"
    : "transition(reqById('"+r.id+"'),'"+a.event+"')";
}

};

S.motive = () => {
  const [id, event] = (state.param||'').split(':');
  const r = reqById(id);
  if(!r) return topbar("Motif", true) + empty('&#9888;', "Demande introuvable.");
  const decline = event === 'decline';
  const dispute = event === 'dispute';
  const noshow  = event === 'noshow';
  const other = u(r.cyclist===state.role ? r.host : r.cyclist);
  const reasons = noshow
    ? ["Personne ne s'est présenté","Prévenu trop tard","Rendez-vous manqué","Autre"]
    : dispute
    ? ["Le vélo n'a pas été restitué","L'autre personne est injoignable","Le vélo est endommagé",
       "Le lieu ne correspond pas à l'annonce","Autre"]
    : decline
    ? ["Plus de place ce jour-là","Créneau qui ne me convient pas","Type de vélo non accepté","Je préfère ne pas répondre"]
    : actorOf(r) === 'host'
    ? ["Absence imprévue","L'emplacement n'est plus accessible","Problème de santé",
       "Erreur de ma part","Autre"]
    : ["Changement de programme","J'ai trouvé une autre solution","Erreur dans ma demande","Autre"];
  let h = topbar(noshow ? "Le vélo n'a pas été remis"
    : dispute ? "Signaler un problème"
    : (decline ? "Refuser la demande" : "Annuler"), true) + '<div class="pad">';
  h += '<p class="t-s muted" style="line-height:1.7;margin-bottom:14px">'
    + (noshow ? "Vous avez attendu " + esc(publicName(other.id)) + " sans le voir venir. "
        + "La garde se ferme, la place se libère, et l'absence est enregistrée. "
        + "Elle n'apparaît sur aucun profil public."
      : dispute ? "Un modérateur reprend le dossier avec l'historique complet de la garde. "
               + "La garde est gelé : ni vous ni " + esc(publicName(other.id)) + " ne pouvez plus le faire avancer."
      : decline ? esc(publicName(other.id))+" sera prévenu. Le motif l'aide à mieux demander la prochaine fois."
      : (actorOf(r) === 'host' && isLateCancel(r))
        ? esc(publicName(other.id))+" a prévu de venir dans moins de "+LATE_H+" heures. "
          + "Il sera prévenu immédiatement et verra les emplacements encore libres sur son "
          + "créneau. Le désistement est enregistré."
        : esc(publicName(other.id)) + " avait bloqué sa place pour vous. Il sera prévenu "
          + "immédiatement, et l'annulation est enregistrée sur la garde — pas sur "
          + "votre profil.")+'</p>';
  h += '<label>Motif</label><div class="chips" style="margin-bottom:14px">'
    + reasons.map((x,i)=>'<button class="chip'+(state.motive===x||(!state.motive&&i===0)?' on':'')
        + '" onclick="state.motive=\''+x.replace(/'/g,"\\'")+'\';render()">'+x+'</button>').join('')+'</div>';
  h += '<div class="field"><label>Précision (facultatif)</label><textarea id="mv"></textarea></div></div>';
  h += '<div class="footer"><button class="btn '+(decline||dispute||noshow?'danger':'ghost')+'" onclick="confirmMotive(\''+id+'\',\''+event+'\')">'
    + (noshow ? "Confirmer l'absence" : dispute ? "Ouvrir le litige"
       : decline ? "Confirmer le refus" : "Confirmer l'annulation")+'</button>'
    + '<button class="btn ghost" onclick="back()">Revenir</button></div>';
  return h;
};
function confirmMotive(id, event){
  const extra = (document.getElementById('mv')||{}).value || '';
  const reason = (state.motive || "Motif non précisé") + (extra.trim() ? " — " + extra.trim() : "");
  state.motive = null;
  const r = reqById(id);
  state.back.pop();
  transition(r, event, reason);
  if(event === 'dispute'){
    if(r.links) r.links.frozen = true;
    toast("Litige ouvert. La modération prend le relais.");
    return;
  }
  if(event === 'noshow'){
    r.noShow = {declaredBy: state.role, at: clock(), reason};
    notify(r.cyclist, publicName(state.role) + " a indiqué que le vélo n'a pas été déposé : "
      + reason + ". La garde est close.", {screen:'detail', param:r.id});
    toast("Absence enregistrée. La place est de nouveau libre.");
    return;
  }
  // Un desistement tardif se trace des deux cotes, mais il ne coute pas la meme
  // chose : le membre reste dehors avec son velo, le bike sitter a bloque une
  // place pour rien. On previent donc differemment.
  if(event === 'cancel' && isLateCancel(r)){
    const side = actorOf(r);
    r.lateCancel = {by: state.role, side: side, at: clock(), reason};
    if(side === 'host'){
      notify(r.cyclist,
        publicName(state.role) + " s'est désisté à moins de "+LATE_H+" heures : "
        + reason + ". Voici les emplacements encore libres sur votre créneau.",
        {screen:'rescue', param:r.id}, true);
      go('rescue', r.id);
      return;
    }
    notify(r.host,
      publicName(state.role) + " a annulé à moins de "+LATE_H+" heures : " + reason
      + ". La place est de nouveau libre sur ce créneau.",
      {screen:'detail', param:r.id}, true);
    toast("Annulation enregistrée. " + publicName(r.host) + " est prévenu.");
    return;
  }
  if(event === 'noanswer'){
    notify(r.host, publicName(r.cyclist) + " s'est présenté et n'a pas pu vous joindre. "
      + "Il est reparti avec son vélo. La place est de nouveau libre."
      + (reason ? " Motif : " + reason : ''),
      {screen:'detail', param:r.id}, true);
    toast("Garde close. " + publicName(r.host) + " est prévenu.");
    return;
  }
  notify(r.cyclist===state.role ? r.host : r.cyclist,
    (event==='decline' ? "Demande refusée : " : "Garde annulée : ") + reason);
}

S.review = () => {
  const r = reqById(state.param);
  if(!r) return topbar("Avis", true) + empty('&#9733;', "Garde introuvable.");
  if(!isParty(r)) return refusedScreen();
  // Passe quatorze jours, le souvenir s'estompe : la fenetre se ferme.
  if(r.status === 'COMPLETED' && !reviewWindowOpen(r))
    return topbar("Avis", true)
      + empty('&#9733;', "Le délai pour laisser un avis est passé.",
          "Il court pendant " + REVIEW_OPEN_D + " jours après la fin de la garde.");
  const other = u(r.cyclist===state.role?r.host:r.cyclist);
  const asCyclist = actorOf(r)==='cyclist';
  const criteria = asCyclist?["Accueil","Communication","Qualité du lieu"]:["Ponctualité","Communication","Respect"];
  const d = state.reviewDraft;
  let h = topbar("Votre avis sur "+other.name, true) + '<div class="pad">';
  // Le commentaire d'abord : on raconte, puis on note. Une note posee en premier
  // tire tout le reste vers elle.
  h += '<div class="field"><label>Comment ça s\'est passé ?</label>'
    + '<textarea oninput="state.reviewDraft.text=this.value" placeholder="Ce qui s\'est bien passé, ce qui pourrait aider le prochain cycliste…">'
    + esc(d.text||'')+'</textarea></div>';
  criteria.forEach((c,i)=>{
    h += '<div class="row" style="justify-content:space-between;margin-bottom:12px">'
      + '<span class="t-s">'+c+'</span>'+stars(d['c'+i]||0, 'c'+i)+'</div>';
  });
  h += '<div class="row" style="justify-content:space-between;padding-top:10px;border-top:1px solid var(--chalk);margin-bottom:14px">'
    + '<span class="t-s strong">Note générale</span>'+stars(d.overall||0, 'overall')+'</div>';
  h += '<div class="banner trust">Votre avis reste invisible tant que '+esc(publicName(other.id))+" n'a pas déposé le sien. "
    + 'Publication automatique après 14 jours.</div>';
  const issues = [];
  if(!d.overall) issues.push("Donnez une note générale.");
  h += errors(issues) + '</div>'
    + '<div class="footer"><button class="btn primary" onclick="postReview(\''+r.id+'\')"'
    + (issues.length?' disabled':'')+'>Publier mon avis</button></div>';
  return h;
};
function postReview(id){
  const r = reqById(id);
  if(!isParty(r)){ toast("Cette garde ne vous concerne pas."); return; }
  const other = r.cyclist===state.role?r.host:r.cyclist;
  if(state.reviews.some(v=>v.session===id && v.author===state.role)){ toast("Vous avez déjà noté cette garde."); return; }
  const d = state.reviewDraft;
  if(!d.overall){ toast("Donnez une note générale."); return; }
  const asCyclist = actorOf(r)==='cyclist';
  const names = asCyclist ? ["Accueil","Communication","Qualité du lieu"] : ["Ponctualité","Communication","Respect"];
  const criteria = {};
  names.forEach((label,i)=>{ if(d['c'+i]) criteria[label] = d['c'+i]; });
  state.reviews.unshift({id:'v'+(state.seq++), author:state.role, target:other, session:id,
    dir: asCyclist?'cyclist_to_host':'host_to_cyclist', rating:d.overall, criteria,
    text:(d.text||'').trim() || "Aucun commentaire.", date:"aujourd'hui", status:'pending', ageH:0});
  state.reviewDraft = {};
  // Publication a l'aveugle : les deux avis apparaissent ensemble, ou apres 14 jours.
  const pair = state.reviews.filter(v=>v.session===id);
  if(pair.length === 2){
    pair.forEach(v=>{ v.status='published'; });
    notify(other, "Les avis de votre garde sont publiés.");
    toast("Les deux avis sont déposés : ils sont publiés.");
  } else {
    toast("Avis enregistré. Invisible tant que "+u(other).name+" n'a pas déposé le sien.");
  }
  back();
}

    + '<button class="btn primary" style="width:auto;padding:11px 15px" onclick="send(\''+c.id+'\')">Envoyer</button></div></div>';

function send(id){
  const c0 = convoById(id);
  if(c0 && c0.a !== state.role && c0.b !== state.role){
    toast("Cette conversation ne vous concerne pas.");
    return;
  }
  const el = document.getElementById('msg'); if(!el.value.trim()) return;
  const text = el.value.trim(); el.value = '';
  act("Message", () => {
    (state.messages[id] = state.messages[id]||[]).push({from:state.role, text, at:clock()});
  });
  render();
}

/** Une notification est une porte : elle ouvre l'objet dont elle parle. */
function openNotif(id){
  const n = state.notifications.find(x=>x.id===id);
  if(!n) return;
  n.read = true;
  if(!n.link){ render(); return; }
  const exists = n.link.screen==='detail' || n.link.screen==='review' ? reqById(n.link.param)
               : n.link.screen==='space'  ? spaceById(n.link.param)
               : n.link.screen==='theft'  ? theftById(n.link.param) : true;
  if(!exists){ toast("Cet élément n'existe plus."); render(); return; }
  go(n.link.screen, n.link.param);
}

  if(!b || b.owner !== state.role){ toast("Ce vélo n'est pas le vôtre."); return; }

    && !['COMPLETED','DECLINED','CANCELLED','EXPIRED'].includes(r.status));
  if(used.length){ toast("Ce vélo est engagé dans une garde en cours."); return; }

  if(myBikes().length === 1){ toast("Gardez au moins un vélo enregistré."); return; }
  confirmAction("Supprimer le vélo",
    "« "+b.name+" » sera retiré de votre compte. Vos gardes passés le mentionneront toujours.",

    () => { state.bikes = state.bikes.filter(x=>x.id!==id); toast("Vélo supprimé"); render(); });

    + '<div class="footer"><button class="btn primary" onclick="submitReport(\''+type+'\',\''+id+'\')">Envoyer le signalement</button></div>';

function submitReport(type, id){
  const details = (document.getElementById('rd')||{}).value || '';
  const reason = state.reportReason || "Signalement";
  // Un signalement sans cible n'arrive nulle part, et un signalement contre
  // soi-meme n'a pas de sens : les deux encombraient la file de moderation.
  if(!type || !id){ toast("Ce signalement n'a pas de cible."); return; }
  if(type === 'user' && id === state.role){
    toast("Vous ne pouvez pas vous signaler vous-même."); return;
  }
  if(state.reports.some(p=>p.by===state.role && p.target===id && p.status!=='resolved')){
    toast("Vous avez déjà un signalement en cours sur cette cible."); back(); return;
  }
  state.reports.unshift({id:'p'+(state.seq++), by:state.role, targetType:type, target:id,
    reason, details: details.trim() || "Aucun détail fourni.", status:'open', date:"aujourd'hui"});
  state.reportReason = null;
  notify(state.role, "Votre signalement a été transmis à la modération.");
  toast("Signalement envoyé"); back();
}

/** Les etats ou quelqu'un compte encore sur vous. */
const ENGAGE = ['ACCEPTED','ARRIVAL','BIKE_RECEIVED','ACTIVE','RETURN_REQUESTED',
                'BIKE_RETURNED','DISPUTED'];
const engagements = who => state.requests.filter(r =>
  (r.cyclist === who || r.host === who) && ENGAGE.includes(r.status));

/*
 * Toute action en cours, y compris une demande qui attend une reponse.
 *
 * On ne supprime ni ne met en pause tant que quelque chose est ouvert : un velo
 * quelque part, ou quelqu'un devant une demande sans reponse.
 */
const actionsEnCours = who => state.requests.filter(r =>
  (r.cyclist === who || r.host === who)
  && (ENGAGE.includes(r.status) || r.status === 'PENDING'));

/** Ce qui retient un emplacement precis. */
const actionsSurEmplacement = id => state.requests.filter(r =>
  r.spaceId === id && (ENGAGE.includes(r.status) || r.status === 'PENDING'));

function confirmDelete(){
  // Un compte ne disparait pas au milieu d'une garde : il y a un velo quelque part,
  // et quelqu'un en face qui l'attend.
  const encours = actionsEnCours(state.role);
  if(encours.length){
    confirmAction("Impossible pour l'instant",
      encours.length + (encours.length > 1 ? " gardes ou demandes sont" : " garde ou demande est")
      + " en cours. Terminez-les, ou répondez-y, avant de supprimer votre compte : "
      + "quelqu'un compte sur vous, et un vélo est peut-être encore chez lui.",
      "J'ai compris", () => { go('activity'); });
    return;

  confirmAction("Supprimer mon compte",
    "Cette action est définitive. Vos emplacements sont retirés, vos conversations effacées, vos avis anonymisés. "
    + "Seules les traces de modération sont conservées, pour raisons légales.",
    "Supprimer définitivement",
    () => {
      toast("Compte supprimé. Un e-mail de confirmation vous a été envoyé.");
      setRole('guest');

  // garde acceptee, ou une demande qui attend une reponse.
  if(s.status === 'published'){

};
function setSpace(id, key, value){
  if(!isOwner(spaceById(id))){ toast(MSG.notYours); return; }
  spaceById(id)[key] = value; render();
}
function setFreq(id, freq){
  const sp = spaceById(id);
  // On ne coupe pas une serie en cours : les gardes acceptees vont a leur terme.
  const running = state.requests.filter(r =>
    r.spaceId === id && HELD.includes(r.status) && (r.repeat||'none') !== 'none').length;
  sp.freq = freq;
  toast(freq === 'ponctuel'
    ? (running ? "Ponctuel seulement. Les " + running + " série(s) en cours vont à leur terme."
               : "Ponctuel seulement")
    : "Ponctuel ou régulier");
  render();
}
function setMaxDays(id, days){
  const sp = spaceById(id);
  const engaged = state.requests.filter(r =>
    r.spaceId === id && HELD.includes(r.status) && spanDays(r) > days);
  if(engaged.length){
    toast(engaged.length + " garde(s) en cours dépassent cette durée.");
    return;
  }
  sp.maxDays = days;
  toast(MAX_DAYS[days]);
  render();
}
function setFee(id, unit, amount){
  const sp = spaceById(id);
  if(unit === null){ sp.fee = null; toast("Emplacement gratuit"); render(); return; }
  const current = sp.fee || {};
  // Changer d'unite conserve le montant : seul le plafond journalier s'applique.
  const next = {
    unit,
    amount: amount === null ? (current.amount || 1) : amount
  };
  const issues = feeIssues(next);
  if(issues.length){ toast(issues[0]); return; }
  sp.fee = next;
  toast(next.amount + " € " + FEE_UNITS[unit].label + " · jamais plus de " + FEE_MAX + " € par jour");
  render();
}
function setKind(k){
  const d = state.wizard.data;
  d.kind = k;
  if(isRelay(d)){
    // Un lieu ouvert au public n'accueille pas la nuit sans local ferme.
    if(!d.closedStorage) d.maxDays = 1;
    if(d.type === 'Garage privé') d.type = 'Emplacement en salle';
  } else {
    d.org = {name:'', number:'', email:''};
    d.allowed = false;
    if(d.type === 'Emplacement en salle') d.type = 'Garage privé';
  }
  render();
}
function toggleSpaceBike(id, b){

const affectedRequests = id => state.requests.filter(r => r.spaceId===id

/** La suppression est refusee s'il reste un engagement en cours (§8.2). */
function deleteSpace(id){
  // Un emplacement ne se modifie que par celui qui l'a publie.
  if(!isOwner(spaceById(id))){ toast(MSG.notYours); return; }

/**
 * On previent avant, pas apres.
 * Laisser quelqu'un remplir cinq etapes pour lui refuser la publication a la
 * fin est la pire facon de faire respecter une regle : elle est juste, mais
 * elle se decouvre trop tard.
 */
function startWizard(){
  if(!isActive(state.role)){
    toast("Votre identité doit être validée avant de proposer un emplacement.");
    go('verif');
    return;
  }
  state.wizard = {step:1, data: freshSpaceDraft()};
  go('wizard');
}
/**
 * Calendrier des fermetures. La regle hebdomadaire remplit les dates ;
 * on ne ferme au clic que les exceptions — conge, jour ferie, inventaire.
 */
function closureCalendar(d, onToggle){
  const closures = d.closures || [];
  const fn = onToggle || 'toggleWizClosure';
  let h = '<label>Fermetures exceptionnelles</label>'
    + '<p class="t-xs muted" style="margin-bottom:8px">Cliquez une date pour la fermer. '
    + 'Vos jours de fermeture habituels sont déjà grisés.</p>'
    + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:8px">';
  ['L','M','M','J','V','S','D'].forEach(x=>{
    h += '<div class="t-xs muted" style="padding:3px 0">'+x+'</div>';
  });
  for(let day = 1; day <= 30; day++){
    const label = labelOfDay(day);
    const openDay = label && (d.days || []).includes(weekdayOf(label));
    const closed = label && closures.includes(label);
    h += '<div style="padding:7px 0;border-radius:7px;font-size:13px;'
      + (closed ? 'background:var(--alert-wash);color:var(--alert-ink);cursor:pointer;'
                : openDay ? 'background:var(--trust-wash);color:var(--trust-deep);cursor:pointer;'
                          : 'color:var(--chalk-strong);')
      + '"' + ((label && openDay) || closed ? ' onclick="'+fn+'(\''+label+'\')"' : '')
      + '>'+day+'</div>';
  }
  h += '</div>';
  if(closures.length)
    h += '<div class="banner alert">Fermé le '+esc(closures.map(fmtDate).join(', '))+'.<br>'
      + 'Aucune demande ne vous parviendra sur ces dates, et vos gardes déjà acceptées '
      + 'vous seront rappelés.</div>';
  return h;
}
function toggleWizClosure(label){
  const d = state.wizard.data;
  d.closures = d.closures || [];
  d.closures = d.closures.includes(label)
    ? d.closures.filter(x => x !== label)
    : d.closures.concat(label).sort((a,b) => dateIndex(a) - dateIndex(b));
  render();
}
function toggleSpaceClosure(label){
  const sp = spaceById(state.param);
  if(!isOwner(sp)){ toast(MSG.notYours); return; }
  sp.closures = sp.closures || [];
  if(sp.closures.includes(label)){
    sp.closures = sp.closures.filter(x => x !== label);
  } else {
    // Une fermeture ne doit jamais faire disparaitre une garde en silence.
    const hit = state.requests.filter(r =>
      r.spaceId === sp.id && HELD.includes(r.status) &&
      dateIndex(r.date) <= dateIndex(label) && dateIndex(endDate(r)) >= dateIndex(label));
    sp.closures = sp.closures.concat(label).sort((a,b) => dateIndex(a) - dateIndex(b));
    hit.forEach(r => {
      notify(sp.owner, "Vous fermez le "+fmtDate(label)+" : prévenez "
        + publicName(r.cyclist)+", son vélo était prévu ce jour-là.", {screen:'detail', param:r.id});
      notify(r.cyclist, publicName(sp.owner)+" a signalé une fermeture le "+fmtDate(label)
        + ". Contactez-le pour convenir d'une solution.", {screen:'detail', param:r.id});
    });
    if(hit.length) toast(hit.length+" garde(s) concernée(s) : les deux parties sont prévenues");
  }
  render();
}

    h += '<div class="banner lamp">Cet emplacement est un <span class="strong">brouillon</span> : '
      + "sans jour d'accueil, il n'apparaît dans aucune recherche.</div>";
  h += '<label>Jours d\'accueil</label><div class="chips" style="margin-bottom:12px">'
    + DAYS.map(([l,v])=>'<button class="chip'+(o.days.includes(v)?' on':'')

    + '<div class="two" style="margin-bottom:6px">'
    + '<div><label>Dépôt à partir de</label>' + heurePicker(o.from, "setSpaceHours('"+sp.id+"','from',this.value)") + '</div>'
    + '<div><label>Retour jusqu\'à</label>' + heurePicker(o.to, "setSpaceHours('"+sp.id+"','to',this.value)") + '</div></div>'
    + '<p class="t-xs muted" style="margin-bottom:14px">Le dépôt et la récupération doivent '
    + 'tomber dans ces heures. Entre les deux, le vélo reste sur place.</p>';
  h += closureCalendar({days:o.days, closures:sp.closures||[]}, 'toggleSpaceClosure');
  h += '<label>Durée maximale acceptée</label><div class="chips" style="margin-bottom:12px">'
    + Object.entries(MAX_DAYS).map(([k,l])=>'<button class="chip'+((sp.maxDays||1)===+k?' on':'')
        + '" onclick="setMaxDays(\''+sp.id+'\','+k+')">'+esc(l)+'</button>').join('')+'</div>'
    + '<label>Fréquence acceptée</label><div class="chips" style="margin-bottom:12px">'
    + Object.entries(FREQ).map(([k,l])=>'<button class="chip'+((sp.freq||'regulier')===k?' on':'')
        + '" onclick="setFreq(\''+sp.id+'\',\''+k+'\')">'+esc(l)+'</button>').join('')+'</div>'
    + '<label>Votre délai de réponse habituel</label><div class="chips">'
    + Object.entries(REPLY).map(([k,l])=>'<button class="chip'+((sp.reply||'jour')===k?' on':'')
        + '" onclick="setSpaceReply(\''+sp.id+'\',\''+k+'\')">'+esc(l)+'</button>').join('')+'</div>';
  return h + '</div><div class="footer">'
    + '<button class="btn primary" onclick="tab(\'profile\')">Terminer</button></div>';
};
function toggleSpaceDay(id, v){
  // Un emplacement ne se modifie que par celui qui l'a publie.
  if(!isOwner(spaceById(id))){ toast(MSG.notYours); return; }
  const sp = spaceById(id);
  const a = sp.open.days;
  const i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1);
  // Un emplacement redevient reservable des qu'il a un jour d'accueil.
  if(a.length && sp.status === 'draft') sp.status = 'published';
  if(!a.length && sp.status === 'published') sp.status = 'draft';
  render();
}
function setSpaceHours(id, side, v){

function dropSpacePhoto(id, i){
  // Un emplacement ne se modifie que par celui qui l'a publie.
  if(!isOwner(spaceById(id))){ toast(MSG.notYours); return; }
  const sp = spaceById(id);
  // Un emplacement publie garde au moins deux photos : c'est ce qui le rend credible.
  if(sp.status === 'published' && sp.photoList.length <= 2){

function moveSpacePhoto(id, i, dir){
  // Un emplacement ne se modifie que par celui qui l'a publie.
  if(!isOwner(spaceById(id))){ toast(MSG.notYours); return; }

  if(j < 0 || j >= sp.photoList.length) return;
  [sp.photoList[i], sp.photoList[j]] = [sp.photoList[j], sp.photoList[i]];
  render();
}

/** Apercu de l'emplacement, tel qu'il sera lu. */
function recapCard(d){
  const rows = [];
  rows.push(['&#128690;', 'Jusqu\'à '+d.capacity+' vélo'+(d.capacity>1?'s':'')]);
  if(d.lock && d.lock!=='aucun') rows.push(['&#128274;', LOCK_KINDS[d.lock]]);
  if(d.weather) rows.push(['&#127968;', WEATHER_KINDS[d.weather]]);
  if(d.anchor) rows.push(['&#128279;', d.anchorKind || 'Point d\'ancrage']);
  if((d.securityExtra||[]).length) rows.push(['&#128247;', d.securityExtra.join(', ')]);
  if(d.bikes.includes('Électrique') && d.plug) rows.push(['&#9889;', 'Recharge possible']);
  if(d.access) rows.push(['&#128682;', 'Accès : '+d.access.toLowerCase()]);
  return '<div class="card" style="background:var(--paper)"><div class="card-body">'
    + '<p class="t-xs muted" style="margin-bottom:6px">'+esc(t('w.recap'))+'</p>'
    + '<p class="strong" style="font-family:var(--display);font-size:16px">'
    + esc(d.spot || d.type || 'Emplacement')+'</p>'
    + rows.map(([i,l])=>'<p class="t-s" style="margin-top:5px">'+i+' '+esc(l)+'</p>').join('')
    + '</div></div>';
}

/** Boutons d'ordre et de retrait d'une photo, communs a l'assistant. */

function photoGrid(d){

    return '<div class="empty" style="padding:22px 8px">Aucune photo pour l\'instant.</div>';
  return '<div class="two" style="flex-wrap:wrap;margin-bottom:8px">'
    + d.photoList.map((ph,i)=>'<div style="flex:0 0 48%;margin-bottom:8px">'

      + (i===0?'outline:2px solid var(--trust);outline-offset:-2px':'')+'"></div>'
